<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вырасти цветок</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background-image: url("fon.PNG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================
   ПРОГРЕСС
   ========================= */

#progress {
    position: absolute;

    top: 24px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    padding: 10px 24px;

    border-radius: 30px;

    background: rgba(255,255,255,0.92);

    color: #4d704c;

    font-size: clamp(20px, 2.4vw, 34px);
    font-weight: 800;

    box-shadow: 0 5px 14px rgba(0,0,0,0.12);
}


/* =========================
   ЦЕНТР
   ========================= */

#plantArea {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    width: min(25vw, 350px);
    height: min(44vw, 500px);

    min-width: 240px;
    min-height: 360px;

    z-index: 10;
}


/* =========================
   РАСТЕНИЕ
   ========================= */

#plant {
    position: absolute;

    left: 50%;

    /*
       Новое положение.
       48% было слишком высоко.
       16% было слишком низко.
    */
    bottom: 24%;

    width: 190px;
    height: 270px;

    transform: translateX(-50%);

    transform-origin: center bottom;

    /*
       Растение находится ЗА передней
       частью горшка, чтобы его земля
       из PNG была скрыта горшком.
       Но стебель и листья видны сверху.
    */
    z-index: 25;

    pointer-events: none;
}


/* Все стадии */

.plant-stage {
    position: absolute;

    left: 50%;
    bottom: 0;

    object-fit: contain;
    object-position: center bottom;

    transform-origin: center bottom;

    pointer-events: none;

    opacity: 0;
}


/* Маленький росток */

#sproutImage {
    width: 115px;
    height: 170px;

    transform:
        translateX(-50%)
        scale(1);

    opacity: 1;

    transition:
        transform 0.5s ease,
        filter 0.7s ease;
}


/* Растение с бутоном */

#budImage {
    width: 180px;
    height: 270px;

    transform:
        translateX(-50%)
        scale(0.72);

    transition:
        opacity 0.35s ease,
        transform 0.7s ease;
}


/* Раскрытый цветок */

#flowerImage {
    width: 190px;
    height: 280px;

    transform:
        translateX(-50%)
        scale(0.72);

    transition:
        opacity 0.35s ease,
        transform 0.7s ease;
}


/* =========================
   УВЯДАНИЕ РОСТКА
   ========================= */

#plant.wilt #sproutImage {
    animation:
        wiltSprout
        0.9s
        ease
        forwards;

    filter:
        saturate(0.65)
        brightness(0.85);
}

@keyframes wiltSprout {

    0% {
        transform:
            translateX(-50%)
            rotate(0deg)
            translateY(0)
            scale(1);
    }

    45% {
        transform:
            translateX(-50%)
            rotate(13deg)
            translateY(4px)
            scale(0.98);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(28deg)
            translateY(18px)
            scale(0.94);
    }
}


/* =========================
   ГОРШОК
   ========================= */

#potImage {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 100%;
    height: auto;

    object-fit: contain;

    /*
       Горшок поверх нижней части растения.
    */
    z-index: 30;

    pointer-events: none;

    filter:
        drop-shadow(
            0 10px 8px rgba(0,0,0,0.16)
        );
}


/* =========================
   БУКВА
   ========================= */

#targetLetter {
    position: absolute;

    left: 50%;
    bottom: 15.5%;

    transform:
        translate(-50%, 50%);

    z-index: 40;

    font-size:
        clamp(42px, 4.5vw, 66px);

    font-weight: 900;

    color: #a4422e;

    line-height: 1;

    pointer-events: none;
}


/* =========================
   ЛЕЙКИ
   ========================= */

.watering-can {
    position: absolute;

    bottom: 7%;

    width: min(24vw, 330px);

    cursor: pointer;

    z-index: 60;

    transform-origin: center center;

    transition:
        left 0.8s ease,
        right 0.8s ease,
        bottom 0.8s ease,
        transform 0.65s ease;

    touch-action: manipulation;
}

#leftCan {
    left: 12%;
}

#rightCan {
    right: 12%;
}

.watering-can img {
    display: block;

    width: 100%;
    height: auto;

    pointer-events: none;

    filter:
        drop-shadow(
            0 8px 7px rgba(0,0,0,0.14)
        );
}


/* =========================
   КАПЛИ
   ========================= */

.water-drop {
    position: fixed;

    width: 15px;
    height: 22px;

    border-radius:
        50% 50% 60% 60%;

    background:
        linear-gradient(
            #84d8ff,
            #3aa5e4
        );

    z-index: 90;

    opacity: 0;

    pointer-events: none;
}


/* =========================
   ДАЛЬШЕ
   ========================= */

#nextButton {
    position: absolute;

    right: 4%;
    bottom: 4%;

    padding: 17px 36px;

    border: none;
    border-radius: 30px;

    background: white;
    color: #3f7748;

    font-size: 24px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 15px rgba(0,0,0,0.15);

    z-index: 110;

    display: none;
}


@media (max-width: 900px) {

    .watering-can {
        width: min(27vw, 280px);
    }

    #leftCan {
        left: 8%;
    }

    #rightCan {
        right: 8%;
    }

    #plant {
        bottom: 23%;
    }
}

</style>
</head>


<body>

<div id="game">


    <div id="progress">
        1 / 2
    </div>


    <!-- ЛЕВАЯ ЛЕЙКА -->

    <div
        class="watering-can"
        id="leftCan"
    >

        <img
            id="leftCanImage"
            src=""
            alt=""
            draggable="false"
        >

    </div>


    <!-- ПРАВАЯ ЛЕЙКА -->

    <div
        class="watering-can"
        id="rightCan"
    >

        <img
            id="rightCanImage"
            src=""
            alt=""
            draggable="false"
        >

    </div>


    <!-- ЦЕНТР -->

    <div id="plantArea">


        <!-- ТРИ СТАДИИ РАСТЕНИЯ -->

        <div id="plant">

            <img
                id="sproutImage"
                class="plant-stage"
                src="images/plants/sprout.PNG"
                alt=""
                draggable="false"
            >

            <img
                id="budImage"
                class="plant-stage"
                src="images/plants/flower1_bud.PNG"
                alt=""
                draggable="false"
            >

            <img
                id="flowerImage"
                class="plant-stage"
                src="images/plants/flower1.PNG"
                alt=""
                draggable="false"
            >

        </div>


        <!-- ГОРШОК -->

        <img
            id="potImage"
            src="gorschok.PNG"
            alt=""
            draggable="false"
        >


        <!-- БУКВА -->

        <div id="targetLetter">
            Л
        </div>


    </div>


    <button id="nextButton">
        Дальше
    </button>


</div>


<script>

/* ==============================
   РАУНДЫ
   ============================== */

const rounds = [

    {
        letter: "Л",

        leftImage:
            "images/round1_left.PNG",

        rightImage:
            "images/round1_right.PNG",

        correct: "left",

        budImage:
            "images/plants/flower1_bud.PNG",

        flowerImage:
            "images/plants/flower1.PNG"
    },

    {
        letter: "Р",

        leftImage:
            "images/round2_left.PNG",

        rightImage:
            "images/round2_right.PNG",

        correct: "left",

        budImage:
            "images/plants/flower1_bud.PNG",

        flowerImage:
            "images/plants/flower1.PNG"
    }

];


/* ==============================
   СОСТОЯНИЕ
   ============================== */

let currentRound = 0;

let animationLocked = false;

let plantState =
    "sprout";


/* ==============================
   ЭЛЕМЕНТЫ
   ============================== */

const leftCan =
    document.getElementById(
        "leftCan"
    );

const rightCan =
    document.getElementById(
        "rightCan"
    );

const leftCanImage =
    document.getElementById(
        "leftCanImage"
    );

const rightCanImage =
    document.getElementById(
        "rightCanImage"
    );

const sproutImage =
    document.getElementById(
        "sproutImage"
    );

const budImage =
    document.getElementById(
        "budImage"
    );

const flowerImage =
    document.getElementById(
        "flowerImage"
    );

const plant =
    document.getElementById(
        "plant"
    );

const potImage =
    document.getElementById(
        "potImage"
    );

const targetLetter =
    document.getElementById(
        "targetLetter"
    );

const progress =
    document.getElementById(
        "progress"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );


/* ==============================
   ПРЕДЗАГРУЗКА
   ============================== */

function preloadImages() {

    const files = [

        "images/round1_left.PNG",
        "images/round1_right.PNG",

        "images/round2_left.PNG",
        "images/round2_right.PNG",

        "images/plants/sprout.PNG",

        "images/plants/flower1_bud.PNG",

        "images/plants/flower1.PNG"

    ];

    files.forEach(src => {

        const image =
            new Image();

        image.src =
            src;

    });
}


/* ==============================
   РАУНД
   ============================== */

function loadRound() {

    const round =
        rounds[currentRound];


    progress.textContent =
        `${currentRound + 1} / ${rounds.length}`;


    targetLetter.textContent =
        round.letter;


    leftCanImage.src =
        round.leftImage;


    rightCanImage.src =
        round.rightImage;


    /*
       Подготавливаем именно нужные
       картинки растения.
    */

    budImage.src =
        round.budImage;


    flowerImage.src =
        round.flowerImage;


    resetPlant();

    resetCans();


    nextButton.style.display =
        "none";
}


/* ==============================
   СБРОС РАСТЕНИЯ
   ============================== */

function resetPlant() {

    plantState =
        "sprout";


    plant.classList.remove(
        "wilt"
    );


    /*
       Показываем ТОЛЬКО росток.
    */

    sproutImage.style.opacity =
        "1";


    sproutImage.style.animation =
        "none";


    sproutImage.style.filter =
        "none";


    sproutImage.style.transform =
        `
        translateX(-50%)
        rotate(0deg)
        translateY(0)
        scale(1)
        `;


    budImage.style.opacity =
        "0";


    budImage.style.transform =
        `
        translateX(-50%)
        scale(0.72)
        `;


    flowerImage.style.opacity =
        "0";


    flowerImage.style.transform =
        `
        translateX(-50%)
        scale(0.72)
        `;
}


/* ==============================
   СБРОС ЛЕЕК
   ============================== */

function resetCans() {

    leftCan.style.left =
        "12%";

    leftCan.style.right =
        "auto";

    leftCan.style.bottom =
        "7%";

    leftCan.style.transform =
        "rotate(0deg)";


    rightCan.style.right =
        "12%";

    rightCan.style.left =
        "auto";

    rightCan.style.bottom =
        "7%";

    rightCan.style.transform =
        "rotate(0deg)";
}


/* ==============================
   НАЖАТИЕ
   ============================== */

async function chooseCan(side) {

    if (animationLocked) {
        return;
    }


    if (plantState === "flower") {
        return;
    }


    animationLocked =
        true;


    const round =
        rounds[currentRound];


    const can =
        side === "left"
        ? leftCan
        : rightCan;


    const correct =
        side ===
        round.correct;


    await animateWatering(
        can,
        side
    );


    if (correct) {

        await growPlant();

        plantState =
            "flower";


        nextButton.style.display =
            "block";

    } else {

        await wiltPlant();

        plantState =
            "wilted";
    }


    animationLocked =
        false;
}


/* ==============================
   ПОЛИВ
   ============================== */

async function animateWatering(
    can,
    side
) {

    if (side === "left") {

        can.style.left =
            "28%";

        can.style.bottom =
            "35%";

        can.style.transform =
            "rotate(28deg)";

    } else {

        can.style.right =
            "28%";

        can.style.bottom =
            "35%";

        can.style.transform =
            "rotate(-28deg)";
    }


    await wait(850);


    createWater(
        can,
        side
    );


    await wait(1300);


    if (side === "left") {

        can.style.left =
            "12%";

        can.style.bottom =
            "7%";

        can.style.transform =
            "rotate(0deg)";

    } else {

        can.style.right =
            "12%";

        can.style.bottom =
            "7%";

        can.style.transform =
            "rotate(0deg)";
    }


    await wait(650);
}


/* ==============================
   ВОДА
   ============================== */

function createWater(
    can,
    side
) {

    const canRect =
        can.getBoundingClientRect();


    const potRect =
        potImage.getBoundingClientRect();


    const startX =
        side === "left"

        ? canRect.right -
          canRect.width * 0.12

        : canRect.left +
          canRect.width * 0.12;


    const startY =
        canRect.top +
        canRect.height * 0.45;


    const endX =
        potRect.left +
        potRect.width / 2;


    const endY =
        potRect.top +
        potRect.height * 0.12;


    for (
        let i = 0;
        i < 14;
        i++
    ) {

        setTimeout(
            () => {

                createDrop(
                    startX,
                    startY,
                    endX,
                    endY
                );

            },

            i * 75
        );
    }
}


/* ==============================
   КАПЛЯ
   ============================== */

function createDrop(
    startX,
    startY,
    endX,
    endY
) {

    const drop =
        document.createElement(
            "div"
        );


    drop.className =
        "water-drop";


    drop.style.left =
        `${startX}px`;


    drop.style.top =
        `${startY}px`;


    drop.style.opacity =
        "1";


    document.body.appendChild(
        drop
    );


    requestAnimationFrame(
        () => {

            drop.style.transition =
                `
                left 0.7s linear,
                top 0.7s ease-in,
                opacity 0.7s linear
                `;


            drop.style.left =
                `${endX}px`;


            drop.style.top =
                `${endY}px`;


            drop.style.opacity =
                "0.2";
        }
    );


    setTimeout(
        () => {

            drop.remove();

        },

        760
    );
}


/* ==============================
   ПРАВИЛЬНЫЙ ОТВЕТ

   Теперь картинки НЕ меняют src.
   Поэтому порядок невозможно
   перепутать.
   ============================== */

async function growPlant() {


    /*
       Если росток был увядшим,
       сначала он выпрямляется.
    */

    plant.classList.remove(
        "wilt"
    );


    sproutImage.style.filter =
        "none";


    sproutImage.style.transform =
        `
        translateX(-50%)
        rotate(0deg)
        translateY(0)
        scale(1)
        `;


    await wait(350);



    /* =========================
       1. РОСТОК
       ========================= */

    sproutImage.style.transform =
        `
        translateX(-50%)
        scale(1.10)
        `;


    await wait(500);



    /* =========================
       2. РОСТОК ИСЧЕЗАЕТ
       ========================= */

    sproutImage.style.opacity =
        "0";


    await wait(300);



    /* =========================
       3. ПОЯВЛЯЕТСЯ БУТОН
       ========================= */

    budImage.style.opacity =
        "1";


    budImage.style.transform =
        `
        translateX(-50%)
        scale(0.78)
        `;


    await wait(80);


    budImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    /*
       Специально держим бутон
       на экране целую секунду.
    */

    await wait(1100);



    /* =========================
       4. БУТОН ИСЧЕЗАЕТ
       ========================= */

    budImage.style.opacity =
        "0";


    await wait(350);



    /* =========================
       5. ТОЛЬКО ТЕПЕРЬ ЦВЕТОК
       ========================= */

    flowerImage.style.opacity =
        "1";


    flowerImage.style.transform =
        `
        translateX(-50%)
        scale(0.76)
        `;


    await wait(80);


    flowerImage.style.transform =
        `
        translateX(-50%)
        scale(1.08)
        `;


    await wait(450);


    flowerImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    await wait(400);
}


/* ==============================
   НЕПРАВИЛЬНЫЙ ОТВЕТ
   ============================== */

async function wiltPlant() {

    /*
       Бутон и цветок гарантированно
       скрыты.
    */

    budImage.style.opacity =
        "0";


    flowerImage.style.opacity =
        "0";


    /*
       Росток остаётся виден.
    */

    sproutImage.style.opacity =
        "1";


    plant.classList.remove(
        "wilt"
    );


    /*
       Перезапускаем animation.
    */

    void plant.offsetWidth;


    plant.classList.add(
        "wilt"
    );


    await wait(1000);
}


/* ==============================
   ДАЛЬШЕ
   ============================== */

nextButton.addEventListener(
    "click",
    () => {

        if (animationLocked) {
            return;
        }


        currentRound++;


        if (
            currentRound >=
            rounds.length
        ) {

            finishGame();

            return;
        }


        loadRound();
    }
);


/* ==============================
   ФИНАЛ
   ============================== */

function finishGame() {

    document
        .getElementById("game")
        .innerHTML = `

        <div
            style="
                position:absolute;
                inset:0;

                display:flex;
                flex-direction:column;

                align-items:center;
                justify-content:center;

                background:
                    rgba(255,255,255,.22);
            "
        >

            <h1
                style="
                    color:#426d46;

                    font-size:
                    clamp(
                        34px,
                        5vw,
                        65px
                    );
                "
            >
                Тест пройден!
            </h1>

            <button
                onclick="location.reload()"

                style="
                    padding:
                        18px 38px;

                    border:0;

                    border-radius:
                        30px;

                    background:white;

                    color:#39764b;

                    font-size:24px;

                    font-weight:800;

                    cursor:pointer;
                "
            >
                Играть ещё раз
            </button>

        </div>
    `;
}


/* ==============================
   WAIT
   ============================== */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* ==============================
   КЛИКИ
   ============================== */

leftCan.addEventListener(
    "click",
    () =>
        chooseCan("left")
);


rightCan.addEventListener(
    "click",
    () =>
        chooseCan("right")
);


/* ==============================
   ЗАПУСК
   ============================== */

preloadImages();

loadRound();

</script>

</body>
</html>
