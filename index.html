<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вырасти цветок</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background-image: url("fon.PNG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================
   ПРОГРЕСС
   ========================= */

#progress {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 100;

    padding: 10px 24px;
    border-radius: 30px;

    background: rgba(255,255,255,0.92);
    color: #4d704c;

    font-size: clamp(20px, 2.4vw, 34px);
    font-weight: 800;

    box-shadow:
        0 5px 14px rgba(0,0,0,0.12);
}


/* =========================
   ЦЕНТР
   ========================= */

#plantArea {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    width: min(25vw, 350px);
    height: min(44vw, 500px);

    min-width: 240px;
    min-height: 360px;

    z-index: 10;
}


/* =========================
   РАСТЕНИЕ
   ========================= */

#plant {
    position: absolute;

    left: 50%;
    bottom: 33%;

    width: 170px;
    height: 230px;

    transform: translateX(-50%);
    transform-origin: center bottom;

    z-index: 35;

    pointer-events: none;
}


/* =========================
   ОБЩИЕ СТИЛИ СТАДИЙ
   ========================= */

.plant-stage {
    position: absolute;

    left: 50%;
    bottom: 0;

    object-fit: contain;
    object-position: center bottom;

    transform-origin: center bottom;

    pointer-events: none;

    display: block;

    opacity: 0;
    visibility: hidden;

    transform:
        translateX(-50%)
        translateY(6px)
        scale(0.90);

    transition:
        opacity 0.48s ease-in-out,
        transform 0.58s ease-in-out,
        filter 0.45s ease;
}


/* =========================
   РОСТОК
   ========================= */

#sproutImage {
    width: 95px;
    height: 135px;
}


/* =========================
   УВЯДШИЙ РОСТОК
   ========================= */

#wiltImage {
    width: 115px;
    height: 165px;
}


/* =========================
   БУТОН
   ========================= */

#budImage {
    width: 155px;
    height: 225px;
}


/* =========================
   ЦВЕТОК
   ========================= */

#flowerImage {
    width: 175px;
    height: 245px;
}


/* =========================
   ГОРШОК
   ========================= */

#potImage {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 100%;
    height: auto;

    object-fit: contain;

    z-index: 30;

    pointer-events: none;

    filter:
        drop-shadow(
            0 10px 8px rgba(0,0,0,0.16)
        );
}


/* =========================
   БУКВА
   ========================= */

#targetLetter {
    position: absolute;

    left: 50%;
    bottom: 15.5%;

    transform:
        translate(-50%, 50%);

    z-index: 40;

    font-size:
        clamp(42px, 4.5vw, 66px);

    font-weight: 900;

    color: #a4422e;

    line-height: 1;

    pointer-events: none;
}


/* =========================
   ЛЕЙКИ
   ========================= */

.watering-can {
    position: absolute;

    bottom: 7%;

    width:
        min(24vw, 330px);

    cursor: pointer;

    z-index: 60;

    transform-origin:
        center center;

    transition:
        left 0.8s ease,
        right 0.8s ease,
        bottom 0.8s ease,
        transform 0.65s ease;

    touch-action: manipulation;
}

#leftCan {
    left: 12%;
}

#rightCan {
    right: 12%;
}

.watering-can img {
    display: block;

    width: 100%;
    height: auto;

    pointer-events: none;

    filter:
        drop-shadow(
            0 8px 7px rgba(0,0,0,0.14)
        );
}


/* =========================
   ВОДА
   ========================= */

.water-drop {
    position: fixed;

    width: 14px;
    height: 20px;

    border-radius:
        50% 50% 60% 60%;

    background:
        linear-gradient(
            #84d8ff,
            #3aa5e4
        );

    z-index: 90;

    pointer-events: none;
}


/* =========================
   ДАЛЬШЕ
   ========================= */

#nextButton {
    position: absolute;

    right: 4%;
    bottom: 4%;

    padding:
        17px 36px;

    border: none;
    border-radius: 30px;

    background: white;
    color: #3f7748;

    font-size: 24px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 15px rgba(0,0,0,0.15);

    z-index: 110;

    display: none;
}


/* =========================
   АДАПТАЦИЯ
   ========================= */

@media (max-width: 900px) {

    .watering-can {
        width:
            min(27vw, 280px);
    }

    #leftCan {
        left: 8%;
    }

    #rightCan {
        right: 8%;
    }
}

</style>
</head>


<body>

<div id="game">


    <div id="progress">
        1 / 5
    </div>


    <!-- ЛЕВАЯ ЛЕЙКА -->

    <div
        class="watering-can"
        id="leftCan"
    >

        <img
            id="leftCanImage"
            src=""
            alt=""
            draggable="false"
        >

    </div>


    <!-- ПРАВАЯ ЛЕЙКА -->

    <div
        class="watering-can"
        id="rightCan"
    >

        <img
            id="rightCanImage"
            src=""
            alt=""
            draggable="false"
        >

    </div>


    <!-- ЦЕНТР -->

    <div id="plantArea">


        <div id="plant">


            <!-- РОСТОК -->

            <img
                id="sproutImage"
                class="plant-stage"
                src="images/plants/sprout.PNG"
                alt=""
                draggable="false"
            >


            <!-- УВЯДШИЙ РОСТОК -->

            <img
                id="wiltImage"
                class="plant-stage"
                src="images/plants/wilt.PNG"
                alt=""
                draggable="false"
            >


            <!-- БУТОН -->

            <img
                id="budImage"
                class="plant-stage"
                src="images/plants/flower1.PNG"
                alt=""
                draggable="false"
            >


            <!-- РАСКРЫТЫЙ ЦВЕТОК -->

            <img
                id="flowerImage"
                class="plant-stage"
                src="images/plants/flower1_bud.PNG"
                alt=""
                draggable="false"
            >

        </div>


        <img
            id="potImage"
            src="gorschok.PNG"
            alt=""
            draggable="false"
        >


        <div id="targetLetter">
            Л
        </div>

    </div>


    <button id="nextButton">
        Дальше
    </button>

</div>


<script>

/* =========================
   РАУНДЫ
   ========================= */

const rounds = [

    {
        letter: "Л",
        leftImage: "images/round1_left.PNG",
        rightImage: "images/round1_right.PNG",
        correct: "left",

        budImage:
            "images/plants/flower1.PNG",

        flowerImage:
            "images/plants/flower1_bud.PNG"
    },

    {
        letter: "Р",
        leftImage: "images/round2_left.PNG",
        rightImage: "images/round2_right.PNG",
        correct: "left",

        budImage:
            "images/plants/flower2.PNG",

        flowerImage:
            "images/plants/flower2_bud.PNG"
    },

    {
        letter: "Р",
        leftImage: "images/round3_left.PNG",
        rightImage: "images/round3_right.PNG",
        correct: "right",

        budImage:
            "images/plants/flower3.PNG",

        flowerImage:
            "images/plants/flower3_bud.PNG"
    },

    {
        letter: "Л",
        leftImage: "images/round4_left.PNG",
        rightImage: "images/round4_right.PNG",
        correct: "right",

        budImage:
            "images/plants/flower4.PNG",

        flowerImage:
            "images/plants/flower4_bud.PNG"
    },

    {
        letter: "Р",
        leftImage: "images/round5_left.PNG",
        rightImage: "images/round5_right.PNG",
        correct: "left",

        budImage:
            "images/plants/flower5.PNG",

        flowerImage:
            "images/plants/flower5_bud.PNG"
    }

];


/* =========================
   СОСТОЯНИЕ
   ========================= */

let currentRound = 0;
let animationLocked = false;
let roundFinished = false;

/*
   Был ли в этом раунде
   неправильный ответ?
*/
let plantIsWilted = false;


/* =========================
   ЭЛЕМЕНТЫ
   ========================= */

const leftCan =
    document.getElementById("leftCan");

const rightCan =
    document.getElementById("rightCan");

const leftCanImage =
    document.getElementById("leftCanImage");

const rightCanImage =
    document.getElementById("rightCanImage");

const sproutImage =
    document.getElementById("sproutImage");

const wiltImage =
    document.getElementById("wiltImage");

const budImage =
    document.getElementById("budImage");

const flowerImage =
    document.getElementById("flowerImage");

const targetLetter =
    document.getElementById("targetLetter");

const progress =
    document.getElementById("progress");

const potImage =
    document.getElementById("potImage");

const nextButton =
    document.getElementById("nextButton");


/* =========================
   ПРЕДЗАГРУЗКА
   ========================= */

function preloadImages() {

    const files = [

        "images/round1_left.PNG",
        "images/round1_right.PNG",

        "images/round2_left.PNG",
        "images/round2_right.PNG",

        "images/round3_left.PNG",
        "images/round3_right.PNG",

        "images/round4_left.PNG",
        "images/round4_right.PNG",

        "images/round5_left.PNG",
        "images/round5_right.PNG",

        "images/plants/sprout.PNG",
        "images/plants/wilt.PNG",

        "images/plants/flower1.PNG",
        "images/plants/flower1_bud.PNG",

        "images/plants/flower2.PNG",
        "images/plants/flower2_bud.PNG",

        "images/plants/flower3.PNG",
        "images/plants/flower3_bud.PNG",

        "images/plants/flower4.PNG",
        "images/plants/flower4_bud.PNG",

        "images/plants/flower5.PNG",
        "images/plants/flower5_bud.PNG"

    ];


    files.forEach(src => {

        const img =
            new Image();

        img.src =
            src;

    });

}


/* =========================
   СБРОС РАСТЕНИЯ
   ========================= */

function resetPlant() {

    plantIsWilted =
        false;


    const stages = [
        sproutImage,
        wiltImage,
        budImage,
        flowerImage
    ];


    stages.forEach(img => {

        img.style.display =
            "block";

        img.style.transition =
            "none";

        img.style.opacity =
            "0";

        img.style.visibility =
            "hidden";

        img.style.filter =
            "none";

        img.style.transform =
            `
            translateX(-50%)
            translateY(6px)
            scale(0.90)
            `;
    });


    /*
       Новый раунд:
       только обычный росток.
    */

    sproutImage.style.visibility =
        "visible";

    sproutImage.style.opacity =
        "1";

    sproutImage.style.transform =
        `
        translateX(-50%)
        translateY(0)
        scale(1)
        `;


    requestAnimationFrame(() => {

        stages.forEach(img => {

            img.style.transition =
                `
                opacity 0.48s ease-in-out,
                transform 0.58s ease-in-out,
                filter 0.45s ease
                `;

        });

    });

}


/* =========================
   ПЛАВНОЕ ПРЕВРАЩЕНИЕ
   ========================= */

async function morphPlant(
    currentImage,
    nextImage
) {

    nextImage.style.display =
        "block";

    nextImage.style.visibility =
        "visible";

    nextImage.style.transition =
        "none";

    nextImage.style.opacity =
        "0";

    nextImage.style.transform =
        `
        translateX(-50%)
        translateY(7px)
        scale(0.86)
        `;


    await nextFrame();
    await nextFrame();


    nextImage.style.transition =
        `
        opacity 0.48s ease-in-out,
        transform 0.58s ease-in-out
        `;

    currentImage.style.transition =
        `
        opacity 0.42s ease-in-out,
        transform 0.52s ease-in-out
        `;


    currentImage.style.opacity =
        "0";

    currentImage.style.transform =
        `
        translateX(-50%)
        translateY(-3px)
        scale(1.035)
        `;


    nextImage.style.opacity =
        "1";

    nextImage.style.transform =
        `
        translateX(-50%)
        translateY(0)
        scale(1)
        `;


    await wait(580);


    currentImage.style.visibility =
        "hidden";

}


/* =========================
   ЗАГРУЗКА РАУНДА
   ========================= */

function loadRound() {

    const round =
        rounds[currentRound];


    animationLocked =
        false;

    roundFinished =
        false;


    progress.textContent =
        `${currentRound + 1} / ${rounds.length}`;


    targetLetter.textContent =
        round.letter;


    leftCanImage.src =
        round.leftImage;


    rightCanImage.src =
        round.rightImage;


    budImage.src =
        round.budImage;


    flowerImage.src =
        round.flowerImage;


    resetPlant();
    resetCans();


    nextButton.style.display =
        "none";

}


/* =========================
   СБРОС ЛЕЕК
   ========================= */

function resetCans() {

    leftCan.style.left =
        "12%";

    leftCan.style.right =
        "auto";

    leftCan.style.bottom =
        "7%";

    leftCan.style.transform =
        "rotate(0deg)";


    rightCan.style.right =
        "12%";

    rightCan.style.left =
        "auto";

    rightCan.style.bottom =
        "7%";

    rightCan.style.transform =
        "rotate(0deg)";

}


/* =========================
   НАЖАТИЕ
   ========================= */

async function chooseCan(side) {

    if (
        animationLocked ||
        roundFinished
    ) {
        return;
    }


    animationLocked =
        true;


    const round =
        rounds[currentRound];


    const can =
        side === "left"
        ? leftCan
        : rightCan;


    const correct =
        side === round.correct;


    await animateWatering(
        can,
        side
    );


    if (correct) {

        await growPlant();

        roundFinished =
            true;

        nextButton.style.display =
            "block";

    }

    else {

        await wiltPlant();

    }


    animationLocked =
        false;

}


/* =========================
   ПОЛИВ
   ========================= */

async function animateWatering(
    can,
    side
) {

    if (side === "left") {

        can.style.left =
            "28%";

        can.style.bottom =
            "35%";

        can.style.transform =
            "rotate(28deg)";

    }

    else {

        can.style.right =
            "28%";

        can.style.bottom =
            "35%";

        can.style.transform =
            "rotate(-28deg)";

    }


    await wait(750);


    createWater(
        can,
        side
    );


    await wait(1200);


    if (side === "left") {

        can.style.left =
            "12%";

        can.style.bottom =
            "7%";

        can.style.transform =
            "rotate(0deg)";

    }

    else {

        can.style.right =
            "12%";

        can.style.bottom =
            "7%";

        can.style.transform =
            "rotate(0deg)";

    }


    await wait(600);

}


/* =========================
   ВОДА
   ========================= */

function createWater(
    can,
    side
) {

    const canRect =
        can.getBoundingClientRect();


    const potRect =
        potImage.getBoundingClientRect();


    const startX =
        side === "left"

        ? canRect.right -
          canRect.width * 0.12

        : canRect.left +
          canRect.width * 0.12;


    const startY =
        canRect.top +
        canRect.height * 0.45;


    const endX =
        potRect.left +
        potRect.width / 2;


    const endY =
        potRect.top +
        potRect.height * 0.12;


    for (
        let i = 0;
        i < 14;
        i++
    ) {

        setTimeout(
            () => {

                createDrop(
                    startX,
                    startY,
                    endX,
                    endY
                );

            },

            i * 70
        );

    }

}


/* =========================
   КАПЛЯ
   ========================= */

function createDrop(
    startX,
    startY,
    endX,
    endY
) {

    const drop =
        document.createElement(
            "div"
        );


    drop.className =
        "water-drop";


    drop.style.left =
        `${startX}px`;

    drop.style.top =
        `${startY}px`;

    drop.style.opacity =
        "1";


    document.body.appendChild(
        drop
    );


    requestAnimationFrame(
        () => {

            drop.style.transition =
                `
                left .7s linear,
                top .7s ease-in,
                opacity .7s linear
                `;


            drop.style.left =
                `${endX}px`;


            drop.style.top =
                `${endY}px`;


            drop.style.opacity =
                ".2";

        }
    );


    setTimeout(
        () => drop.remove(),
        760
    );

}


/* =========================
   ПРАВИЛЬНЫЙ ОТВЕТ
   ========================= */

async function growPlant() {

    /*
       ЕСЛИ ДО ЭТОГО БЫЛА ОШИБКА:
       начинаем рост прямо
       с увядшего растения.
    */

    if (plantIsWilted) {

        /*
           Обычный росток не показываем.
        */

        sproutImage.style.opacity =
            "0";

        sproutImage.style.visibility =
            "hidden";


        /*
           Увядший росток должен
           оставаться видимым.
        */

        wiltImage.style.display =
            "block";

        wiltImage.style.visibility =
            "visible";

        wiltImage.style.opacity =
            "1";

        wiltImage.style.transform =
            `
            translateX(-50%)
            translateY(0)
            scale(1)
            `;


        /*
           УВЯДШИЙ → БУТОН
        */

        await morphPlant(
            wiltImage,
            budImage
        );


        await wait(260);


        /*
           БУТОН → ЦВЕТОК
        */

        await morphPlant(
            budImage,
            flowerImage
        );


        flowerImage.style.transition =
            "transform 0.22s ease-out";


        flowerImage.style.transform =
            `
            translateX(-50%)
            translateY(0)
            scale(1.025)
            `;


        await wait(180);


        flowerImage.style.transform =
            `
            translateX(-50%)
            translateY(0)
            scale(1)
            `;


        await wait(180);


        plantIsWilted =
            false;


        return;
    }


    /*
       ЕСЛИ ОШИБКИ НЕ БЫЛО:
       обычная последовательность.
    */

    sproutImage.style.display =
        "block";

    sproutImage.style.visibility =
        "visible";

    sproutImage.style.opacity =
        "1";

    sproutImage.style.filter =
        "none";


    sproutImage.style.transition =
        "transform 0.34s ease-in-out";


    sproutImage.style.transform =
        `
        translateX(-50%)
        translateY(-2px)
        scale(1.055)
        `;


    await wait(300);


    /*
       РОСТОК → БУТОН
    */

    await morphPlant(
        sproutImage,
        budImage
    );


    await wait(260);


    /*
       БУТОН → ЦВЕТОК
    */

    await morphPlant(
        budImage,
        flowerImage
    );


    flowerImage.style.transition =
        "transform 0.22s ease-out";


    flowerImage.style.transform =
        `
        translateX(-50%)
        translateY(0)
        scale(1.025)
        `;


    await wait(180);


    flowerImage.style.transform =
        `
        translateX(-50%)
        translateY(0)
        scale(1)
        `;


    await wait(180);

}


/* =========================
   НЕПРАВИЛЬНЫЙ ОТВЕТ
   ========================= */

async function wiltPlant() {

    /*
       Теперь запоминаем,
       что растение увяло.
    */

    plantIsWilted =
        true;


    budImage.style.opacity =
        "0";

    budImage.style.visibility =
        "hidden";


    flowerImage.style.opacity =
        "0";

    flowerImage.style.visibility =
        "hidden";


    /*
       Если ребёнок уже ошибался раньше
       и снова нажал неправильную лейку,
       увядший росток просто остаётся.
    */

    if (
        wiltImage.style.visibility === "visible" &&
        wiltImage.style.opacity === "1"
    ) {

        await wait(250);

        return;
    }


    /*
       Обычный росток —
       исходное состояние.
    */

    sproutImage.style.display =
        "block";

    sproutImage.style.visibility =
        "visible";

    sproutImage.style.opacity =
        "1";

    sproutImage.style.filter =
        "none";

    sproutImage.style.transform =
        `
        translateX(-50%)
        translateY(0)
        scale(1)
        `;


    /*
       Готовим увядший росток.
    */

    wiltImage.style.display =
        "block";

    wiltImage.style.visibility =
        "visible";

    wiltImage.style.transition =
        "none";

    wiltImage.style.opacity =
        "0";

    wiltImage.style.transform =
        `
        translateX(-50%)
        translateY(5px)
        scale(0.94)
        `;


    await nextFrame();
    await nextFrame();


    /*
       РОСТОК → УВЯДШИЙ
    */

    sproutImage.style.transition =
        `
        opacity 0.50s ease-in-out,
        transform 0.55s ease-in-out,
        filter 0.50s ease-in-out
        `;


    wiltImage.style.transition =
        `
        opacity 0.55s ease-in-out,
        transform 0.60s ease-in-out
        `;


    sproutImage.style.opacity =
        "0";

    sproutImage.style.filter =
        "saturate(0.75) brightness(0.9)";

    sproutImage.style.transform =
        `
        translateX(-50%)
        translateY(2px)
        scale(0.97)
        `;


    wiltImage.style.opacity =
        "1";

    wiltImage.style.transform =
        `
        translateX(-50%)
        translateY(0)
        scale(1)
        `;


    await wait(600);


    sproutImage.style.visibility =
        "hidden";

}


/* =========================
   ДАЛЬШЕ
   ========================= */

nextButton.addEventListener(
    "click",
    () => {

        if (animationLocked) {
            return;
        }


        currentRound++;


        if (
            currentRound >=
            rounds.length
        ) {

            finishGame();

            return;
        }


        loadRound();

    }
);


/* =========================
   ФИНАЛ
   ========================= */

function finishGame() {

    document
        .getElementById("game")
        .innerHTML = `

        <div
            style="
                position:absolute;
                inset:0;

                display:flex;
                flex-direction:column;

                justify-content:center;
                align-items:center;

                background:
                    rgba(255,255,255,.22);
            "
        >

            <h1
                style="
                    color:#426d46;

                    font-size:
                    clamp(
                        34px,
                        5vw,
                        65px
                    );
                "
            >
                Игра окончена!
            </h1>


            <button
                onclick="location.reload()"

                style="
                    padding:18px 38px;

                    border:0;

                    border-radius:30px;

                    background:white;

                    color:#39764b;

                    font-size:24px;
                    font-weight:800;

                    cursor:pointer;
                "
            >
                Играть ещё раз
            </button>

        </div>
        `;

}


/* =========================
   СЛЕДУЮЩИЙ КАДР
   ========================= */

function nextFrame() {

    return new Promise(
        resolve => {

            requestAnimationFrame(
                () => resolve()
            );

        }
    );

}


/* =========================
   ПАУЗА
   ========================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================
   КЛИКИ
   ========================= */

leftCan.addEventListener(
    "click",
    () =>
        chooseCan("left")
);


rightCan.addEventListener(
    "click",
    () =>
        chooseCan("right")
);


/* =========================
   ЗАПУСК
   ========================= */

preloadImages();

loadRound();

</script>
