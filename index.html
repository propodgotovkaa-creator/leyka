<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вырасти цветок</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    body {
        background: #d9f0d2;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;

        background-image: url("fon.PNG");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
    }

    /* =========================
       ПРОГРЕСС
       ========================= */

    #progress {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 50;

        padding: 10px 24px;
        border-radius: 30px;

        background: rgba(255,255,255,0.9);

        color: #4d704c;

        font-size: clamp(20px, 2.4vw, 34px);
        font-weight: 800;

        box-shadow: 0 5px 14px rgba(0,0,0,0.12);
    }

    /* =========================
       ЦЕНТРАЛЬНАЯ ЗОНА
       ========================= */

    #plantArea {
        position: absolute;

        left: 50%;
        bottom: 7%;

        transform: translateX(-50%);

        width: min(25vw, 350px);
        height: min(44vw, 500px);

        min-width: 240px;
        min-height: 360px;

        z-index: 10;
    }

    /* =========================
       ГОРШОК
       ========================= */

    #potImage {
        position: absolute;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        width: 100%;
        height: auto;

        object-fit: contain;

        z-index: 20;

        pointer-events: none;

        filter: drop-shadow(
            0 10px 8px rgba(0,0,0,0.16)
        );
    }

    /* =========================
       БУКВА
       ========================= */

    #targetLetter {
        position: absolute;

        left: 50%;
        bottom: 15.5%;

        transform: translate(-50%, 50%);

        z-index: 30;

        font-size: clamp(42px, 4.5vw, 66px);
        font-weight: 900;

        color: #a4422e;

        line-height: 1;
        text-align: center;

        pointer-events: none;
    }

    /* =========================
       РАСТЕНИЕ
       ========================= */

    #plant {
        position: absolute;

        left: 50%;
        bottom: 52%;

        width: 180px;
        height: 230px;

        transform: translateX(-50%);
        transform-origin: bottom center;

        z-index: 15;

        transition:
            transform 1s ease,
            opacity 0.5s ease;
    }

    #stem {
        position: absolute;

        left: 50%;
        bottom: 0;

        width: 13px;
        height: 62px;

        transform: translateX(-50%);
        transform-origin: bottom center;

        background: #4d9b4d;

        border-radius: 20px;

        box-shadow:
            inset 2px 0 2px rgba(255,255,255,0.25);

        transition:
            height 1.2s ease,
            transform 1s ease,
            background 0.8s ease;
    }

    .leaf {
        position: absolute;

        width: 57px;
        height: 31px;

        background:
            linear-gradient(
                135deg,
                #74c864,
                #4f9f50
            );

        border-radius:
            100% 0 100% 0;

        transform-origin: center;

        transition:
            transform 1s ease,
            opacity 0.7s ease;
    }

    #leafLeft {
        left: 28px;
        bottom: 40px;

        transform:
            rotate(-25deg)
            scale(0.85);
    }

    #leafRight {
        right: 28px;
        bottom: 64px;

        transform:
            scaleX(-1)
            rotate(-25deg)
            scale(0.85);
    }

    /* =========================
       ЦВЕТОК
       ========================= */

    #flower {
        position: absolute;

        left: 50%;
        bottom: 158px;

        width: 120px;
        height: 120px;

        transform:
            translateX(-50%)
            scale(0);

        transform-origin: center;

        z-index: 5;

        transition:
            transform 0.9s
            cubic-bezier(.3,1.4,.4,1);
    }

    .petal {
        position: absolute;

        width: 58px;
        height: 58px;

        border-radius: 50%;

        background:
            linear-gradient(
                145deg,
                #ffe56b,
                #f8c945
            );

        box-shadow:
            inset 3px 3px 6px rgba(255,255,255,0.35);
    }

    .petal:nth-child(1) {
        top: 0;
        left: 31px;
    }

    .petal:nth-child(2) {
        top: 31px;
        right: 0;
    }

    .petal:nth-child(3) {
        bottom: 0;
        left: 31px;
    }

    .petal:nth-child(4) {
        top: 31px;
        left: 0;
    }

    .flower-center {
        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        width: 48px;
        height: 48px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 35% 35%,
                #a56b36,
                #78471f
            );

        z-index: 5;
    }

    /* =========================
       НАСТОЯЩИЕ ЛЕЙКИ
       ========================= */

    .watering-can {
        position: absolute;

        bottom: 12%;

        width: min(24vw, 330px);
        height: auto;

        cursor: pointer;

        z-index: 35;

        transform-origin: center center;

        transition:
            left 0.8s ease,
            right 0.8s ease,
            bottom 0.8s ease,
            transform 0.65s ease,
            opacity 0.3s ease;

        touch-action: manipulation;
    }

    #leftCan {
        left: 4%;
    }

    #rightCan {
        right: 4%;
    }

    .watering-can img {
        display: block;
        width: 100%;
        height: auto;

        pointer-events: none;

        filter: drop-shadow(
            0 8px 7px rgba(0,0,0,0.14)
        );
    }

    /* =========================
       КАПЛИ
       ========================= */

    .water-drop {
        position: fixed;

        width: 15px;
        height: 22px;

        border-radius:
            50% 50% 60% 60%;

        background:
            linear-gradient(
                #84d8ff,
                #3aa5e4
            );

        z-index: 60;

        opacity: 0;

        pointer-events: none;

        box-shadow:
            inset 2px 2px 3px rgba(255,255,255,0.45);
    }

    /* =========================
       КНОПКА
       ========================= */

    #nextButton {
        position: absolute;

        right: 4%;
        bottom: 4%;

        padding: 17px 36px;

        border: none;

        border-radius: 30px;

        background: white;

        color: #3f7748;

        font-size: 24px;
        font-weight: 800;

        cursor: pointer;

        box-shadow:
            0 7px 15px rgba(0,0,0,0.15);

        z-index: 80;

        display: none;

        touch-action: manipulation;
    }

    /* =========================
       СОСТОЯНИЯ РАСТЕНИЯ
       ========================= */

    #plant.grow #stem {
        height: 185px;
    }

    #plant.grow #leafLeft {
        transform:
            rotate(-36deg)
            scale(1.18);
    }

    #plant.grow #leafRight {
        transform:
            scaleX(-1)
            rotate(-36deg)
            scale(1.18);
    }

    #plant.grow #flower {
        transform:
            translateX(-50%)
            scale(1);
    }

    #plant.wilt {
        transform:
            translateX(-50%)
            rotate(28deg)
            translateY(20px);
    }

    #plant.wilt #stem {
        background: #7b9559;

        transform:
            translateX(-50%)
            scaleY(0.84);
    }

    #plant.wilt #leafLeft {
        transform:
            rotate(-85deg)
            translateY(12px)
            scale(0.9);
    }

    #plant.wilt #leafRight {
        transform:
            scaleX(-1)
            rotate(-85deg)
            translateY(12px)
            scale(0.9);
    }

    /* =========================
       АДАПТАЦИЯ
       ========================= */

    @media (max-width: 900px) {

        .watering-can {
            width: min(27vw, 280px);
        }

        #leftCan {
            left: 1%;
        }

        #rightCan {
            right: 1%;
        }
    }

</style>
</head>

<body>

<div id="game">

    <div id="progress">
        1 / 2
    </div>

    <!-- ЛЕВАЯ ЛЕЙКА -->
    <div
        class="watering-can"
        id="leftCan"
    >
        <img
            id="leftCanImage"
            src=""
            alt=""
            draggable="false"
        >
    </div>

    <!-- ПРАВАЯ ЛЕЙКА -->
    <div
        class="watering-can"
        id="rightCan"
    >
        <img
            id="rightCanImage"
            src=""
            alt=""
            draggable="false"
        >
    </div>

    <!-- ЦЕНТР -->
    <div id="plantArea">

        <div id="plant">

            <div id="stem"></div>

            <div
                class="leaf"
                id="leafLeft"
            ></div>

            <div
                class="leaf"
                id="leafRight"
            ></div>

            <div id="flower">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="flower-center"></div>

            </div>

        </div>

        <img
            id="potImage"
            src="gorschok.PNG"
            alt=""
            draggable="false"
        >

        <div id="targetLetter">
            Л
        </div>

    </div>

    <button id="nextButton">
        Дальше
    </button>

</div>

<script>

/* =========================================
   ДАННЫЕ ДВУХ ТЕСТОВЫХ РАУНДОВ
   ========================================= */

const rounds = [

    {
        letter: "Л",

        leftImage:
            "images/round1_left.PNG",

        rightImage:
            "images/round1_right.PNG",

        correct: "left"
    },

    {
        letter: "Р",

        leftImage:
            "images/round2_left.PNG",

        rightImage:
            "images/round2_right.PNG",

        correct: "left"
    }

];


/* =========================================
   ПЕРЕМЕННЫЕ
   ========================================= */

let currentRound = 0;
let animationLocked = false;

const leftCan =
    document.getElementById("leftCan");

const rightCan =
    document.getElementById("rightCan");

const leftCanImage =
    document.getElementById("leftCanImage");

const rightCanImage =
    document.getElementById("rightCanImage");

const targetLetter =
    document.getElementById("targetLetter");

const progress =
    document.getElementById("progress");

const plant =
    document.getElementById("plant");

const nextButton =
    document.getElementById("nextButton");

const potImage =
    document.getElementById("potImage");


/* =========================================
   ПРЕДЗАГРУЗКА ВСЕХ ЛЕЕК
   ========================================= */

function preloadImages() {

    rounds.forEach(round => {

        const leftImg =
            new Image();

        leftImg.src =
            round.leftImage;


        const rightImg =
            new Image();

        rightImg.src =
            round.rightImage;
    });
}


/* =========================================
   ЗАГРУЗКА РАУНДА
   ========================================= */

function loadRound() {

    const round =
        rounds[currentRound];

    progress.textContent =
        `${currentRound + 1} / ${rounds.length}`;

    targetLetter.textContent =
        round.letter;

    leftCanImage.src =
        round.leftImage;

    rightCanImage.src =
        round.rightImage;

    resetPlant();

    resetCans();

    nextButton.style.display =
        "none";
}


/* =========================================
   СБРОС ЛЕЕК
   ========================================= */

function resetCans() {

    leftCan.style.left =
        "4%";

    leftCan.style.right =
        "auto";

    leftCan.style.bottom =
        "12%";

    leftCan.style.transform =
        "none";


    rightCan.style.right =
        "4%";

    rightCan.style.left =
        "auto";

    rightCan.style.bottom =
        "12%";

    rightCan.style.transform =
        "none";
}


/* =========================================
   ВЫБОР
   ========================================= */

async function chooseCan(side) {

    if (animationLocked) {
        return;
    }

    animationLocked = true;

    const round =
        rounds[currentRound];

    const can =
        side === "left"
        ? leftCan
        : rightCan;

    const isCorrect =
        side === round.correct;

    await animateWatering(
        can,
        side
    );

    if (isCorrect) {

        await growPlant();

        nextButton.style.display =
            "block";

        animationLocked = false;

    } else {

        await wiltPlant();

        await wait(900);

        resetPlant();

        animationLocked = false;
    }
}


/* =========================================
   АНИМАЦИЯ ЛЕЙКИ
   ========================================= */

async function animateWatering(
    can,
    side
) {

    /*
       Двигаем лейку к центру.
    */

    can.style.bottom =
        "40%";

    if (side === "left") {

        can.style.left =
            "27%";

        can.style.transform =
            "rotate(-28deg)";

    } else {

        can.style.right =
            "27%";

        can.style.transform =
            "rotate(28deg)";
    }

    await wait(850);

    createWater(
        can,
        side
    );

    await wait(1350);

    /*
       Возвращаем лейку.
    */

    if (side === "left") {

        can.style.left =
            "4%";

        can.style.bottom =
            "12%";

        can.style.transform =
            "none";

    } else {

        can.style.right =
            "4%";

        can.style.bottom =
            "12%";

        can.style.transform =
            "none";
    }

    await wait(700);
}


/* =========================================
   ВОДА
   ========================================= */

function createWater(
    can,
    side
) {

    const canRect =
        can.getBoundingClientRect();

    const potRect =
        potImage.getBoundingClientRect();

    let startX;

    /*
       Пока ориентируемся примерно
       на край изображения лейки.

       После теста по скриншоту
       подправим точную точку носика.
    */

    if (side === "left") {

        startX =
            canRect.right -
            canRect.width * 0.12;

    } else {

        startX =
            canRect.left +
            canRect.width * 0.12;
    }

    const startY =
        canRect.top +
        canRect.height * 0.45;

    const endX =
        potRect.left +
        potRect.width / 2;

    const endY =
        potRect.top +
        potRect.height * 0.14;

    for (
        let i = 0;
        i < 14;
        i++
    ) {

        setTimeout(() => {

            createDrop(
                startX,
                startY,
                endX,
                endY
            );

        }, i * 75);
    }
}


function createDrop(
    startX,
    startY,
    endX,
    endY
) {

    const drop =
        document.createElement("div");

    drop.className =
        "water-drop";

    drop.style.left =
        `${startX}px`;

    drop.style.top =
        `${startY}px`;

    drop.style.opacity =
        "1";

    document.body.appendChild(
        drop
    );

    requestAnimationFrame(() => {

        drop.style.transition =
            `
            left 0.7s linear,
            top 0.7s cubic-bezier(.4,0,.7,1),
            opacity 0.7s linear
            `;

        drop.style.left =
            `${endX}px`;

        drop.style.top =
            `${endY}px`;

        drop.style.opacity =
            "0.25";
    });

    setTimeout(() => {

        drop.remove();

    }, 760);
}


/* =========================================
   ПРАВИЛЬНЫЙ ОТВЕТ
   ========================================= */

async function growPlant() {

    plant.classList.remove(
        "wilt"
    );

    plant.classList.add(
        "grow"
    );

    await wait(1800);
}


/* =========================================
   НЕПРАВИЛЬНЫЙ ОТВЕТ
   ========================================= */

async function wiltPlant() {

    plant.classList.remove(
        "grow"
    );

    plant.classList.add(
        "wilt"
    );

    await wait(1250);
}


/* =========================================
   СБРОС РАСТЕНИЯ
   ========================================= */

function resetPlant() {

    plant.classList.remove(
        "grow",
        "wilt"
    );
}


/* =========================================
   СЛЕДУЮЩИЙ РАУНД
   ========================================= */

nextButton.addEventListener(
    "click",
    () => {

        if (animationLocked) {
            return;
        }

        currentRound++;

        if (
            currentRound >=
            rounds.length
        ) {

            finishGame();
            return;
        }

        loadRound();
    }
);


/* =========================================
   ФИНАЛ ДВУХРАУНДОВОГО ТЕСТА
   ========================================= */

function finishGame() {

    const game =
        document.getElementById("game");

    game.innerHTML = `

        <div
            style="
                position:absolute;
                inset:0;

                display:flex;
                flex-direction:column;

                align-items:center;
                justify-content:center;

                text-align:center;

                background:
                    rgba(255,255,255,0.20);
            "
        >

            <h1
                style="
                    color:#426d46;

                    font-size:
                    clamp(
                        34px,
                        5vw,
                        65px
                    );

                    text-shadow:
                    0 2px 2px white;
                "
            >
                Тест пройден!
            </h1>

            <button
                onclick="
                    location.reload()
                "

                style="
                    padding:
                    18px 38px;

                    border:none;

                    border-radius:
                    32px;

                    background:white;

                    color:#39764b;

                    font-size:
                    24px;

                    font-weight:
                    800;

                    cursor:pointer;

                    box-shadow:
                    0 7px 16px
                    rgba(0,0,0,0.16);
                "
            >
                Играть ещё раз
            </button>

        </div>
    `;
}


/* =========================================
   WAIT
   ========================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================
   КЛИКИ
   ========================================= */

leftCan.addEventListener(
    "click",
    () => chooseCan("left")
);

rightCan.addEventListener(
    "click",
    () => chooseCan("right")
);


/* =========================================
   ЗАПУСК
   ========================================= */

preloadImages();
loadRound();

</script>

</body>
</html>
