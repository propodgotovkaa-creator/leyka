<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вырасти цветок</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    body {
        background: #d9f0d2;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;

        background-image: url("fon.PNG");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
    }

    /* =========================
       ПРОГРЕСС
       ========================= */

    #progress {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 50;

        padding: 10px 24px;

        border-radius: 30px;

        background: rgba(255,255,255,0.9);

        color: #4d704c;

        font-size: clamp(20px, 2.4vw, 34px);
        font-weight: 800;

        box-shadow: 0 5px 14px rgba(0,0,0,0.12);
    }

    /* =========================
       ЦЕНТРАЛЬНАЯ ЗОНА
       ========================= */

    #plantArea {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    width: min(25vw, 350px);
    height: min(44vw, 500px);

    min-width: 240px;
    min-height: 360px;

    z-index: 10;
}

    /* =========================
       ГОРШОК-КАРТИНКА
       ========================= */

    #potImage {
        position: absolute;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        width: 100%;
        height: auto;

        object-fit: contain;

        z-index: 20;

        pointer-events: none;

        filter: drop-shadow(
            0 10px 8px rgba(0,0,0,0.16)
        );
    }

    /* =========================
       БУКВА НА ТАБЛИЧКЕ
       ========================= */

   #targetLetter {
    position: absolute;

    left: 50%;
    bottom: 15.5%;

    transform: translate(-50%, 50%);

    z-index: 30;

    font-size: clamp(42px, 4.5vw, 66px);
    font-weight: 900;

    color: #a4422e;

    line-height: 1;

    text-align: center;

    pointer-events: none;
}
    /* =========================
       РАСТЕНИЕ
       ========================= */

    #plant {
        position: absolute;

        left: 50%;
        bottom: 52%;

        width: 180px;
        height: 230px;

        transform: translateX(-50%);
        transform-origin: bottom center;

        z-index: 15;

        transition:
            transform 1s ease,
            opacity 0.5s ease;
    }

    #stem {
        position: absolute;

        left: 50%;
        bottom: 0;

        width: 13px;
        height: 62px;

        transform: translateX(-50%);
        transform-origin: bottom center;

        background: #4d9b4d;

        border-radius: 20px;

        box-shadow:
            inset 2px 0 2px rgba(255,255,255,0.25);

        transition:
            height 1.2s ease,
            transform 1s ease,
            background 0.8s ease;
    }

    .leaf {
        position: absolute;

        width: 57px;
        height: 31px;

        background:
            linear-gradient(
                135deg,
                #74c864,
                #4f9f50
            );

        border-radius:
            100% 0 100% 0;

        transform-origin: center;

        transition:
            transform 1s ease,
            opacity 0.7s ease;
    }

    #leafLeft {
        left: 28px;
        bottom: 40px;

        transform:
            rotate(-25deg)
            scale(0.85);
    }

    #leafRight {
        right: 28px;
        bottom: 64px;

        transform:
            scaleX(-1)
            rotate(-25deg)
            scale(0.85);
    }

    /* =========================
       ЦВЕТОК
       ========================= */

    #flower {
        position: absolute;

        left: 50%;
        bottom: 158px;

        width: 120px;
        height: 120px;

        transform:
            translateX(-50%)
            scale(0);

        transform-origin: center;

        z-index: 5;

        transition:
            transform 0.9s
            cubic-bezier(.3,1.4,.4,1);
    }

    .petal {
        position: absolute;

        width: 58px;
        height: 58px;

        border-radius: 50%;

        background:
            linear-gradient(
                145deg,
                #ffe56b,
                #f8c945
            );

        box-shadow:
            inset 3px 3px 6px rgba(255,255,255,0.35);
    }

    .petal:nth-child(1) {
        top: 0;
        left: 31px;
    }

    .petal:nth-child(2) {
        top: 31px;
        right: 0;
    }

    .petal:nth-child(3) {
        bottom: 0;
        left: 31px;
    }

    .petal:nth-child(4) {
        top: 31px;
        left: 0;
    }

    .flower-center {
        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        width: 48px;
        height: 48px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 35% 35%,
                #a56b36,
                #78471f
            );

        z-index: 5;
    }

    /* =========================
       ЛЕЙКИ
       ВРЕМЕННЫЕ
       ========================= */

    .watering-can {
        position: absolute;

        bottom: 13%;

        width: 230px;
        height: 195px;

        cursor: pointer;

        z-index: 35;

        transform-origin: center;

        transition:
            left 0.8s ease,
            right 0.8s ease,
            bottom 0.8s ease,
            transform 0.65s ease;

        touch-action: manipulation;
    }

    #leftCan {
        left: 5%;
    }

    #rightCan {
        right: 5%;
    }

    .can-body {
        position: absolute;

        width: 132px;
        height: 100px;

        left: 48px;
        bottom: 10px;

        background:
            linear-gradient(
                145deg,
                #78c1e7,
                #4b97c8
            );

        border-radius: 25px 25px 32px 32px;

        border:
            4px solid
            rgba(255,255,255,0.24);

        box-shadow:
            0 8px 10px rgba(0,0,0,0.12),
            inset 3px 3px 6px rgba(255,255,255,0.25);
    }

    .can-handle {
        position: absolute;

        width: 103px;
        height: 100px;

        left: 62px;
        bottom: 73px;

        border:
            18px solid
            #62acd6;

        border-bottom: 0;

        border-radius:
            60px 60px 0 0;
    }

    .can-spout {
        position: absolute;

        width: 96px;
        height: 32px;

        left: 160px;
        bottom: 48px;

        background: #5ba6d2;

        transform:
            rotate(-20deg);

        transform-origin:
            left center;

        border-radius:
            10px 35px 35px 10px;
    }

    #rightCan .can-spout {
        left: -25px;

        transform:
            rotate(20deg);
    }

    .picture {
        position: absolute;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -45%);

        width: 72px;
        height: 72px;

        border-radius: 18px;

        background: white;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 42px;
        font-weight: 800;

        color: #526171;

        box-shadow:
            0 4px 9px rgba(0,0,0,0.12);

        z-index: 10;
    }

    /* =========================
       КАПЛИ
       ========================= */

    .water-drop {
        position: fixed;

        width: 15px;
        height: 22px;

        border-radius:
            50% 50% 60% 60%;

        background:
            linear-gradient(
                #84d8ff,
                #3aa5e4
            );

        z-index: 60;

        opacity: 0;

        pointer-events: none;

        box-shadow:
            inset 2px 2px 3px rgba(255,255,255,0.45);
    }

    /* =========================
       КНОПКА
       ========================= */

    #nextButton {
        position: absolute;

        right: 4%;
        bottom: 4%;

        padding:
            17px 36px;

        border: none;

        border-radius: 30px;

        background: white;

        color: #3f7748;

        font-size: 24px;
        font-weight: 800;

        cursor: pointer;

        box-shadow:
            0 7px 15px rgba(0,0,0,0.15);

        z-index: 80;

        display: none;

        touch-action: manipulation;
    }

    /* =========================
       СОСТОЯНИЯ РАСТЕНИЯ
       ========================= */

    #plant.grow #stem {
        height: 185px;
    }

    #plant.grow #leafLeft {
        transform:
            rotate(-36deg)
            scale(1.18);
    }

    #plant.grow #leafRight {
        transform:
            scaleX(-1)
            rotate(-36deg)
            scale(1.18);
    }

    #plant.grow #flower {
        transform:
            translateX(-50%)
            scale(1);
    }

    #plant.wilt {
        transform:
            translateX(-50%)
            rotate(28deg)
            translateY(20px);
    }

    #plant.wilt #stem {
        background: #7b9559;

        transform:
            translateX(-50%)
            scaleY(0.84);
    }

    #plant.wilt #leafLeft {
        transform:
            rotate(-85deg)
            translateY(12px)
            scale(0.9);
    }

    #plant.wilt #leafRight {
        transform:
            scaleX(-1)
            rotate(-85deg)
            translateY(12px)
            scale(0.9);
    }

    /* =========================
       АДАПТАЦИЯ
       ========================= */

    @media (max-width: 900px) {

        #plantArea {
            width: min(42vw, 420px);
        }

        .watering-can {
            transform: scale(0.82);
        }

        #leftCan {
            left: -1%;
        }

        #rightCan {
            right: -1%;
        }
    }

    @media (max-width: 650px) {

        #progress {
            top: 12px;
        }

        #plantArea {
            width: min(48vw, 330px);
            min-width: 250px;
            bottom: 7%;
        }

        #targetLetter {
            font-size: clamp(42px, 10vw, 66px);
        }

        .watering-can {
            transform: scale(0.62);
        }

        #leftCan {
            left: -8%;
        }

        #rightCan {
            right: -8%;
        }

        #nextButton {
            font-size: 18px;
            padding: 13px 25px;
        }
    }

</style>
</head>

<body>

<div id="game">

    <div id="progress">
        1 / 10
    </div>

    <!-- ЛЕВАЯ ЛЕЙКА -->
    <div class="watering-can" id="leftCan">

        <div class="can-handle"></div>
        <div class="can-spout"></div>

        <div class="can-body">
            <div
                class="picture"
                id="leftPicture"
            >
                Л
            </div>
        </div>

    </div>

    <!-- ПРАВАЯ ЛЕЙКА -->
    <div class="watering-can" id="rightCan">

        <div class="can-handle"></div>
        <div class="can-spout"></div>

        <div class="can-body">
            <div
                class="picture"
                id="rightPicture"
            >
                Р
            </div>
        </div>

    </div>

    <!-- ЦЕНТР -->
    <div id="plantArea">

        <!-- РОСТОК -->
        <div id="plant">

            <div id="stem"></div>

            <div
                class="leaf"
                id="leafLeft"
            ></div>

            <div
                class="leaf"
                id="leafRight"
            ></div>

            <div id="flower">

                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>

                <div class="flower-center"></div>

            </div>

        </div>

        <!-- ГОРШОК -->
        <img
            id="potImage"
            src="gorschok.PNG"
            alt=""
            draggable="false"
        >

        <!-- БУКВА -->
        <div id="targetLetter">
            Р
        </div>

    </div>

    <button id="nextButton">
        Дальше
    </button>

</div>


<script>

/* =========================================
   РАУНДЫ
   ========================================= */

const rounds = [

    {
        letter: "Р",
        left: {
            label: "Л",
            sound: "Л"
        },
        right: {
            label: "Р",
            sound: "Р"
        },
        correct: "right"
    },

    {
        letter: "Л",
        left: {
            label: "Л",
            sound: "Л"
        },
        right: {
            label: "Р",
            sound: "Р"
        },
        correct: "left"
    },

    {
        letter: "Р",
        left: {
            label: "Р",
            sound: "Р"
        },
        right: {
            label: "Л",
            sound: "Л"
        },
        correct: "left"
    },

    {
        letter: "Л",
        left: {
            label: "Р",
            sound: "Р"
        },
        right: {
            label: "Л",
            sound: "Л"
        },
        correct: "right"
    },

    {
        letter: "Р",
        left: {
            label: "Л",
            sound: "Л"
        },
        right: {
            label: "Р",
            sound: "Р"
        },
        correct: "right"
    },

    {
        letter: "Л",
        left: {
            label: "Л",
            sound: "Л"
        },
        right: {
            label: "Р",
            sound: "Р"
        },
        correct: "left"
    },

    {
        letter: "Р",
        left: {
            label: "Р",
            sound: "Р"
        },
        right: {
            label: "Л",
            sound: "Л"
        },
        correct: "left"
    },

    {
        letter: "Л",
        left: {
            label: "Р",
            sound: "Р"
        },
        right: {
            label: "Л",
            sound: "Л"
        },
        correct: "right"
    },

    {
        letter: "Р",
        left: {
            label: "Л",
            sound: "Л"
        },
        right: {
            label: "Р",
            sound: "Р"
        },
        correct: "right"
    },

    {
        letter: "Л",
        left: {
            label: "Л",
            sound: "Л"
        },
        right: {
            label: "Р",
            sound: "Р"
        },
        correct: "left"
    }

];


/* =========================================
   ПЕРЕМЕННЫЕ
   ========================================= */

let currentRound = 0;
let animationLocked = false;

const leftCan =
    document.getElementById("leftCan");

const rightCan =
    document.getElementById("rightCan");

const leftPicture =
    document.getElementById("leftPicture");

const rightPicture =
    document.getElementById("rightPicture");

const targetLetter =
    document.getElementById("targetLetter");

const progress =
    document.getElementById("progress");

const plant =
    document.getElementById("plant");

const nextButton =
    document.getElementById("nextButton");

const potImage =
    document.getElementById("potImage");


/* =========================================
   ЗАГРУЗКА РАУНДА
   ========================================= */

function loadRound() {

    const round =
        rounds[currentRound];

    progress.textContent =
        `${currentRound + 1} / ${rounds.length}`;

    targetLetter.textContent =
        round.letter;

    leftPicture.textContent =
        round.left.label;

    rightPicture.textContent =
        round.right.label;

    resetPlant();

    nextButton.style.display =
        "none";
}


/* =========================================
   ВЫБОР ЛЕЙКИ
   ========================================= */

async function chooseCan(side) {

    if (animationLocked) {
        return;
    }

    animationLocked = true;

    const round =
        rounds[currentRound];

    const can =
        side === "left"
        ? leftCan
        : rightCan;

    const isCorrect =
        side === round.correct;

    await animateWatering(
        can,
        side
    );

    if (isCorrect) {

        await growPlant();

        nextButton.style.display =
            "block";

        animationLocked = false;

    } else {

        await wiltPlant();

        await wait(900);

        resetPlant();

        animationLocked = false;
    }
}


/* =========================================
   АНИМАЦИЯ ЛЕЙКИ
   ========================================= */

async function animateWatering(
    can,
    side
) {

    const originalCssText =
        can.style.cssText;

    /*
       Поднимаем и двигаем к горшку
    */

    can.style.bottom =
        "43%";

    if (side === "left") {

        can.style.left =
            "29%";

        can.style.transform =
            "rotate(-30deg)";

    } else {

        can.style.right =
            "29%";

        can.style.transform =
            "rotate(30deg)";
    }

    await wait(800);

    /*
       Полив
    */

    createWater(
        can,
        side
    );

    await wait(1250);

    /*
       Возвращаем назад
    */

    can.style.cssText =
        originalCssText;

    await wait(700);
}


/* =========================================
   ВОДА
   ========================================= */

function createWater(
    can,
    side
) {

    const canRect =
        can.getBoundingClientRect();

    const potRect =
        potImage.getBoundingClientRect();

    let startX;

    if (side === "left") {

        startX =
            canRect.right - 12;

    } else {

        startX =
            canRect.left + 12;
    }

    const startY =
        canRect.top +
        canRect.height * 0.58;

    const endX =
        potRect.left +
        potRect.width / 2;

    /*
       Целимся примерно в землю,
       а не в нижнюю часть горшка.
    */

    const endY =
        potRect.top +
        potRect.height * 0.18;

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        setTimeout(() => {

            createDrop(
                startX,
                startY,
                endX,
                endY
            );

        }, i * 80);
    }
}


function createDrop(
    startX,
    startY,
    endX,
    endY
) {

    const drop =
        document.createElement("div");

    drop.className =
        "water-drop";

    drop.style.left =
        `${startX}px`;

    drop.style.top =
        `${startY}px`;

    drop.style.opacity =
        "1";

    document.body.appendChild(
        drop
    );

    requestAnimationFrame(() => {

        drop.style.transition =
            `
            left 0.7s linear,
            top 0.7s cubic-bezier(.4,0,.7,1),
            opacity 0.7s linear
            `;

        drop.style.left =
            `${endX}px`;

        drop.style.top =
            `${endY}px`;

        drop.style.opacity =
            "0.35";
    });

    setTimeout(() => {

        drop.remove();

    }, 760);
}


/* =========================================
   ПРАВИЛЬНЫЙ ОТВЕТ
   ========================================= */

async function growPlant() {

    plant.classList.remove(
        "wilt"
    );

    plant.classList.add(
        "grow"
    );

    await wait(1800);
}


/* =========================================
   НЕПРАВИЛЬНЫЙ ОТВЕТ
   ========================================= */

async function wiltPlant() {

    plant.classList.remove(
        "grow"
    );

    plant.classList.add(
        "wilt"
    );

    await wait(1250);
}


/* =========================================
   СБРОС
   ========================================= */

function resetPlant() {

    plant.classList.remove(
        "grow",
        "wilt"
    );
}


/* =========================================
   ДАЛЬШЕ
   ========================================= */

nextButton.addEventListener(
    "click",
    () => {

        if (animationLocked) {
            return;
        }

        currentRound++;

        if (
            currentRound >=
            rounds.length
        ) {

            finishGame();
            return;
        }

        loadRound();
    }
);


/* =========================================
   ФИНАЛ
   ========================================= */

function finishGame() {

    const game =
        document.getElementById("game");

    game.innerHTML = `

        <div
            style="
                position:absolute;
                inset:0;

                display:flex;
                flex-direction:column;

                align-items:center;
                justify-content:center;

                text-align:center;

                background:
                    rgba(255,255,255,0.22);

                backdrop-filter:
                    blur(2px);
            "
        >

            <div
                style="
                    font-size:
                    clamp(
                        42px,
                        6vw,
                        85px
                    );

                    margin-bottom:
                        10px;
                "
            >
                🌷 🌻 🌸 🌼 🌹
            </div>

            <h1
                style="
                    margin:
                    0 20px 25px;

                    color:
                    #426d46;

                    font-size:
                    clamp(
                        32px,
                        5vw,
                        65px
                    );

                    text-shadow:
                    0 2px 2px white;
                "
            >
                Все цветы выросли!
            </h1>

            <button
                onclick="
                    location.reload()
                "

                style="
                    padding:
                    18px 38px;

                    border:none;

                    border-radius:
                    32px;

                    background:white;

                    color:
                    #39764b;

                    font-size:
                    24px;

                    font-weight:
                    800;

                    cursor:pointer;

                    box-shadow:
                    0 7px 16px
                    rgba(0,0,0,0.16);
                "
            >
                Играть ещё раз
            </button>

        </div>
    `;
}


/* =========================================
   WAIT
   ========================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================
   КЛИКИ
   ========================================= */

leftCan.addEventListener(
    "click",
    () => chooseCan("left")
);

rightCan.addEventListener(
    "click",
    () => chooseCan("right")
);


/* =========================================
   ЗАПУСК
   ========================================= */

loadRound();

</script>

</body>
</html>
