<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вырасти цветок</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: #d9f0d2;
}


/* =========================
   ИГРА
   ========================= */

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background-image: url("fon.PNG");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}


/* =========================
   ПРОГРЕСС
   ========================= */

#progress {
    position: absolute;

    top: 24px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    padding: 10px 24px;

    border-radius: 30px;

    background: rgba(255,255,255,0.92);

    color: #4d704c;

    font-size: clamp(20px, 2.4vw, 34px);
    font-weight: 800;

    box-shadow:
        0 5px 14px rgba(0,0,0,0.12);
}


/* =========================
   ЦЕНТРАЛЬНАЯ ЗОНА
   ========================= */

#plantArea {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    width: min(25vw, 350px);
    height: min(44vw, 500px);

    min-width: 240px;
    min-height: 360px;

    z-index: 10;
}


/* =========================
   ГОРШОК
   ========================= */

#potImage {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 100%;
    height: auto;

    object-fit: contain;

    z-index: 30;

    pointer-events: none;

    filter:
        drop-shadow(
            0 10px 8px rgba(0,0,0,0.16)
        );
}


/* =========================
   БУКВА
   ========================= */

#targetLetter {
    position: absolute;

    left: 50%;
    bottom: 15.5%;

    transform:
        translate(-50%, 50%);

    z-index: 40;

    font-size:
        clamp(42px, 4.5vw, 66px);

    font-weight: 900;

    color: #a4422e;

    line-height: 1;
    text-align: center;

    pointer-events: none;
}


/* =========================
   РАСТЕНИЕ
   ========================= */

#plant {
    position: absolute;

    left: 50%;

    /*
       ГЛАВНОЕ ИЗМЕНЕНИЕ:
       растение теперь намного ниже.
    */
    bottom: 16%;

    width: 155px;
    height: 235px;

    transform:
        translateX(-50%);

    transform-origin:
        center bottom;

    z-index: 20;

    pointer-events: none;
}


/* =========================
   КАРТИНКА РАСТЕНИЯ
   ========================= */

#plantImage {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position:
        center bottom;

    transform:
        translateX(-50%)
        scale(1);

    transform-origin:
        center bottom;

    opacity: 1;

    transition:
        transform 0.55s ease,
        opacity 0.3s ease,
        filter 0.6s ease;
}


/* =========================
   УВЯДАНИЕ
   ========================= */

#plant.wilt {
    animation:
        wiltAnimation
        0.9s
        ease
        forwards;
}

#plant.wilt #plantImage {
    filter:
        saturate(0.6)
        brightness(0.82);
}

@keyframes wiltAnimation {

    0% {
        transform:
            translateX(-50%)
            rotate(0deg)
            translateY(0);
    }

    50% {
        transform:
            translateX(-50%)
            rotate(12deg)
            translateY(5px);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(28deg)
            translateY(17px);
    }
}


/* =========================
   ФИНАЛЬНОЕ РАСКРЫТИЕ
   ========================= */

#plant.bloom {
    animation:
        bloomAnimation
        0.65s
        ease;
}

@keyframes bloomAnimation {

    0% {
        transform:
            translateX(-50%)
            scale(0.92);
    }

    60% {
        transform:
            translateX(-50%)
            scale(1.08);
    }

    100% {
        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =========================
   ЛЕЙКИ
   ========================= */

.watering-can {
    position: absolute;

    bottom: 7%;

    width:
        min(24vw, 330px);

    height: auto;

    cursor: pointer;

    z-index: 60;

    transform-origin:
        center center;

    transition:
        left 0.8s ease,
        right 0.8s ease,
        bottom 0.8s ease,
        transform 0.65s ease;

    touch-action:
        manipulation;
}

#leftCan {
    left: 12%;
}

#rightCan {
    right: 12%;
}

.watering-can img {
    display: block;

    width: 100%;
    height: auto;

    pointer-events: none;

    filter:
        drop-shadow(
            0 8px 7px rgba(0,0,0,0.14)
        );
}


/* =========================
   ВОДА
   ========================= */

.water-drop {
    position: fixed;

    width: 15px;
    height: 22px;

    border-radius:
        50% 50% 60% 60%;

    background:
        linear-gradient(
            #84d8ff,
            #3aa5e4
        );

    z-index: 90;

    opacity: 0;

    pointer-events: none;

    box-shadow:
        inset
        2px 2px 3px
        rgba(255,255,255,0.45);
}


/* =========================
   КНОПКА
   ========================= */

#nextButton {
    position: absolute;

    right: 4%;
    bottom: 4%;

    padding:
        17px 36px;

    border: none;

    border-radius:
        30px;

    background: white;

    color: #3f7748;

    font-size: 24px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 15px
        rgba(0,0,0,0.15);

    z-index: 110;

    display: none;
}


/* =========================
   МОБИЛЬНАЯ АДАПТАЦИЯ
   ========================= */

@media (max-width: 900px) {

    .watering-can {
        width:
            min(27vw, 280px);
    }

    #leftCan {
        left: 8%;
    }

    #rightCan {
        right: 8%;
    }

    #plant {
        bottom: 14%;

        width: 145px;
        height: 220px;
    }
}

</style>
</head>

<body>

<div id="game">


    <!-- ПРОГРЕСС -->

    <div id="progress">
        1 / 2
    </div>


    <!-- ЛЕВАЯ ЛЕЙКА -->

    <div
        class="watering-can"
        id="leftCan"
    >

        <img
            id="leftCanImage"
            src=""
            alt=""
            draggable="false"
        >

    </div>


    <!-- ПРАВАЯ ЛЕЙКА -->

    <div
        class="watering-can"
        id="rightCan"
    >

        <img
            id="rightCanImage"
            src=""
            alt=""
            draggable="false"
        >

    </div>


    <!-- ЦЕНТР -->

    <div id="plantArea">


        <!-- РАСТЕНИЕ -->

        <div id="plant">

            <img
                id="plantImage"
                src="images/plants/sprout.PNG"
                alt=""
                draggable="false"
            >

        </div>


        <!-- ГОРШОК -->

        <img
            id="potImage"
            src="gorschok.PNG"
            alt=""
            draggable="false"
        >


        <!-- БУКВА -->

        <div id="targetLetter">
            Л
        </div>


    </div>


    <!-- ДАЛЬШЕ -->

    <button id="nextButton">
        Дальше
    </button>


</div>


<script>

/* =========================================
   ДАННЫЕ РАУНДОВ
   ========================================= */

const rounds = [

    {
        letter: "Л",

        leftImage:
            "images/round1_left.PNG",

        rightImage:
            "images/round1_right.PNG",

        correct: "left",

        budImage:
            "images/plants/flower1_bud.PNG",

        flowerImage:
            "images/plants/flower1.PNG"
    },

    {
        letter: "Р",

        leftImage:
            "images/round2_left.PNG",

        rightImage:
            "images/round2_right.PNG",

        correct: "left",

        budImage:
            "images/plants/flower1_bud.PNG",

        flowerImage:
            "images/plants/flower1.PNG"
    }

];


/* =========================================
   СОСТОЯНИЕ
   ========================================= */

let currentRound = 0;

let animationLocked = false;

let plantState = "sprout";


/* =========================================
   ЭЛЕМЕНТЫ
   ========================================= */

const leftCan =
    document.getElementById(
        "leftCan"
    );

const rightCan =
    document.getElementById(
        "rightCan"
    );

const leftCanImage =
    document.getElementById(
        "leftCanImage"
    );

const rightCanImage =
    document.getElementById(
        "rightCanImage"
    );

const targetLetter =
    document.getElementById(
        "targetLetter"
    );

const progress =
    document.getElementById(
        "progress"
    );

const plant =
    document.getElementById(
        "plant"
    );

const plantImage =
    document.getElementById(
        "plantImage"
    );

const potImage =
    document.getElementById(
        "potImage"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );


/* =========================================
   ПРЕДЗАГРУЗКА
   ========================================= */

function preloadImages() {

    const sources = [

        "images/round1_left.PNG",
        "images/round1_right.PNG",

        "images/round2_left.PNG",
        "images/round2_right.PNG",

        "images/plants/sprout.PNG",

        "images/plants/flower1_bud.PNG",

        "images/plants/flower1.PNG"

    ];

    sources.forEach(src => {

        const img =
            new Image();

        img.src =
            src;

    });
}


/* =========================================
   ЗАГРУЗКА РАУНДА
   ========================================= */

function loadRound() {

    const round =
        rounds[currentRound];

    progress.textContent =
        `${currentRound + 1} / ${rounds.length}`;

    targetLetter.textContent =
        round.letter;

    leftCanImage.src =
        round.leftImage;

    rightCanImage.src =
        round.rightImage;

    resetPlantForNewRound();

    resetCans();

    nextButton.style.display =
        "none";
}


/* =========================================
   СБРОС ЛЕЕК
   ========================================= */

function resetCans() {

    leftCan.style.left =
        "12%";

    leftCan.style.right =
        "auto";

    leftCan.style.bottom =
        "7%";

    leftCan.style.transform =
        "rotate(0deg)";


    rightCan.style.right =
        "12%";

    rightCan.style.left =
        "auto";

    rightCan.style.bottom =
        "7%";

    rightCan.style.transform =
        "rotate(0deg)";
}


/* =========================================
   ВЫБОР
   ========================================= */

async function chooseCan(side) {

    if (animationLocked) {
        return;
    }

    /*
       Если цветок уже вырос,
       больше выбирать нельзя.
    */

    if (plantState === "flower") {
        return;
    }

    animationLocked = true;

    const round =
        rounds[currentRound];

    const can =
        side === "left"
        ? leftCan
        : rightCan;

    const isCorrect =
        side === round.correct;


    await animateWatering(
        can,
        side
    );


    if (isCorrect) {

        await growPlant();

        plantState =
            "flower";

        nextButton.style.display =
            "block";

    } else {

        await wiltPlant();

        plantState =
            "wilted";
    }


    animationLocked = false;
}


/* =========================================
   АНИМАЦИЯ ЛЕЙКИ
   ========================================= */

async function animateWatering(
    can,
    side
) {

    if (side === "left") {

        can.style.left =
            "28%";

        can.style.bottom =
            "35%";

        can.style.transform =
            "rotate(28deg)";

    } else {

        can.style.right =
            "28%";

        can.style.bottom =
            "35%";

        can.style.transform =
            "rotate(-28deg)";
    }


    await wait(850);


    createWater(
        can,
        side
    );


    await wait(1300);


    /*
       Возврат на место.
    */

    if (side === "left") {

        can.style.left =
            "12%";

        can.style.bottom =
            "7%";

        can.style.transform =
            "rotate(0deg)";

    } else {

        can.style.right =
            "12%";

        can.style.bottom =
            "7%";

        can.style.transform =
            "rotate(0deg)";
    }


    await wait(650);
}


/* =========================================
   ВОДА
   ========================================= */

function createWater(
    can,
    side
) {

    const canRect =
        can.getBoundingClientRect();

    const potRect =
        potImage.getBoundingClientRect();


    let startX;


    if (side === "left") {

        startX =
            canRect.right -
            canRect.width * 0.12;

    } else {

        startX =
            canRect.left +
            canRect.width * 0.12;
    }


    const startY =
        canRect.top +
        canRect.height * 0.45;


    const endX =
        potRect.left +
        potRect.width / 2;


    const endY =
        potRect.top +
        potRect.height * 0.12;


    for (
        let i = 0;
        i < 14;
        i++
    ) {

        setTimeout(
            () => {

                createDrop(
                    startX,
                    startY,
                    endX,
                    endY
                );

            },

            i * 75
        );
    }
}


/* =========================================
   ОДНА КАПЛЯ
   ========================================= */

function createDrop(
    startX,
    startY,
    endX,
    endY
) {

    const drop =
        document.createElement(
            "div"
        );


    drop.className =
        "water-drop";


    drop.style.left =
        `${startX}px`;

    drop.style.top =
        `${startY}px`;

    drop.style.opacity =
        "1";


    document.body.appendChild(
        drop
    );


    requestAnimationFrame(
        () => {

            drop.style.transition =
                `
                left 0.7s linear,
                top 0.7s ease-in,
                opacity 0.7s linear
                `;


            drop.style.left =
                `${endX}px`;

            drop.style.top =
                `${endY}px`;

            drop.style.opacity =
                "0.2";
        }
    );


    setTimeout(
        () => {

            drop.remove();

        },

        760
    );
}


/* =========================================
   ПРАВИЛЬНЫЙ ОТВЕТ
   ========================================= */

async function growPlant() {

    const round =
        rounds[currentRound];


    /*
       Если до этого росток увял,
       возвращаем сам контейнер
       вертикально.
    */

    plant.classList.remove(
        "wilt",
        "bloom"
    );


    plantImage.style.filter =
        "none";


    /* =====================================
       СТАДИЯ 1
       ВСЕГДА СНАЧАЛА ТОЛЬКО РОСТОК
       ===================================== */

    plantImage.style.transition =
        "none";


    plantImage.src =
        "images/plants/sprout.PNG";


    plantImage.style.opacity =
        "1";


    plantImage.style.transform =
        `
        translateX(-50%)
        scale(0.88)
        `;


    /*
       Ждём два кадра браузера.
       Это предотвращает мелькание
       предыдущей картинки.
    */

    await nextFrame();

    await nextFrame();


    plantImage.style.transition =
        `
        transform 0.55s ease,
        opacity 0.3s ease,
        filter 0.6s ease
        `;


    /*
       Росток чуть вытягивается.
    */

    plantImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    await wait(650);



    /* =====================================
       СТАДИЯ 2
       ТОЛЬКО БУТОН
       ===================================== */

    await swapPlantImage(
        round.budImage,
        0.78
    );


    /*
       Бутон плавно увеличивается.
    */

    plantImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    await wait(1100);



    /* =====================================
       СТАДИЯ 3
       ТОЛЬКО ТЕПЕРЬ ЦВЕТОК
       ===================================== */

    await swapPlantImage(
        round.flowerImage,
        0.82
    );


    plantImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    await wait(400);


    plant.classList.add(
        "bloom"
    );


    await wait(650);


    plant.classList.remove(
        "bloom"
    );
}


/* =========================================
   БЕЗОПАСНАЯ СМЕНА PNG
   ========================================= */

async function swapPlantImage(
    newSrc,
    startScale
) {

    /*
       Сначала полностью скрываем
       старую картинку.
    */

    plantImage.style.opacity =
        "0";


    await wait(300);


    /*
       Только после исчезновения
       меняем src.
    */

    plantImage.style.transition =
        "none";


    plantImage.src =
        newSrc;


    /*
       Ждём, пока новая картинка
       действительно загрузится.
    */

    await waitForImage(
        plantImage
    );


    plantImage.style.transform =
        `
        translateX(-50%)
        scale(${startScale})
        `;


    await nextFrame();

    await nextFrame();


    /*
       Возвращаем переходы.
    */

    plantImage.style.transition =
        `
        transform 0.55s ease,
        opacity 0.3s ease,
        filter 0.6s ease
        `;


    plantImage.style.opacity =
        "1";


    await wait(350);
}


/* =========================================
   НЕПРАВИЛЬНЫЙ ОТВЕТ
   ========================================= */

async function wiltPlant() {

    /*
       При ошибке должен увядать
       только росток.
    */

    plant.classList.remove(
        "bloom",
        "wilt"
    );


    plantImage.style.transition =
        "none";


    plantImage.src =
        "images/plants/sprout.PNG";


    await waitForImage(
        plantImage
    );


    plantImage.style.opacity =
        "1";


    plantImage.style.transform =
        `
        translateX(-50%)
        scale(0.88)
        `;


    plantImage.style.filter =
        "none";


    await nextFrame();

    await nextFrame();


    plantImage.style.transition =
        `
        transform 0.55s ease,
        opacity 0.3s ease,
        filter 0.6s ease
        `;


    plant.classList.add(
        "wilt"
    );


    await wait(1000);


    /*
       Здесь специально НЕТ resetPlant.
       Росток остаётся увядшим.
    */
}


/* =========================================
   НОВЫЙ РАУНД
   ========================================= */

function resetPlantForNewRound() {

    plantState =
        "sprout";


    plant.classList.remove(
        "wilt",
        "bloom"
    );


    plantImage.style.transition =
        "none";


    plantImage.src =
        "images/plants/sprout.PNG";


    plantImage.style.opacity =
        "1";


    /*
       Маленький исходный росток.
    */

    plantImage.style.transform =
        `
        translateX(-50%)
        scale(0.88)
        `;


    plantImage.style.filter =
        "none";


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    plantImage.style.transition =
                        `
                        transform 0.55s ease,
                        opacity 0.3s ease,
                        filter 0.6s ease
                        `;
                }
            );
        }
    );
}


/* =========================================
   ДАЛЬШЕ
   ========================================= */

nextButton.addEventListener(
    "click",
    () => {

        if (animationLocked) {
            return;
        }


        currentRound++;


        if (
            currentRound >=
            rounds.length
        ) {

            finishGame();

            return;
        }


        loadRound();
    }
);


/* =========================================
   ФИНАЛ
   ========================================= */

function finishGame() {

    const game =
        document.getElementById(
            "game"
        );


    game.innerHTML = `

        <div
            style="
                position:absolute;
                inset:0;

                display:flex;
                flex-direction:column;

                align-items:center;
                justify-content:center;

                text-align:center;

                background:
                    rgba(255,255,255,0.22);
            "
        >

            <h1
                style="
                    color:#426d46;

                    font-size:
                    clamp(
                        34px,
                        5vw,
                        65px
                    );

                    text-shadow:
                    0 2px 2px white;
                "
            >
                Тест пройден!
            </h1>


            <button
                onclick="
                    location.reload()
                "

                style="
                    padding:
                    18px 38px;

                    border:none;

                    border-radius:
                    32px;

                    background:white;

                    color:#39764b;

                    font-size:24px;

                    font-weight:800;

                    cursor:pointer;

                    box-shadow:
                    0 7px 16px
                    rgba(0,0,0,0.16);
                "
            >
                Играть ещё раз
            </button>

        </div>
    `;
}


/* =========================================
   ОЖИДАНИЕ ЗАГРУЗКИ PNG
   ========================================= */

function waitForImage(img) {

    return new Promise(
        resolve => {

            if (
                img.complete &&
                img.naturalWidth > 0
            ) {

                resolve();

                return;
            }


            const done =
                () => {

                    img.removeEventListener(
                        "load",
                        done
                    );

                    img.removeEventListener(
                        "error",
                        done
                    );

                    resolve();
                };


            img.addEventListener(
                "load",
                done
            );


            img.addEventListener(
                "error",
                done
            );
        }
    );
}


/* =========================================
   СЛЕДУЮЩИЙ КАДР БРАУЗЕРА
   ========================================= */

function nextFrame() {

    return new Promise(
        resolve => {

            requestAnimationFrame(
                () => resolve()
            );
        }
    );
}


/* =========================================
   ПАУЗА
   ========================================= */

function wait(ms) {

    return new Promise(
        resolve => {

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


/* =========================================
   КЛИКИ
   ========================================= */

leftCan.addEventListener(
    "click",
    () => {

        chooseCan(
            "left"
        );
    }
);


rightCan.addEventListener(
    "click",
    () => {

        chooseCan(
            "right"
        );
    }
);


/* =========================================
   ЗАПУСК
   ========================================= */
