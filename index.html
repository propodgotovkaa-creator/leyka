<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вырасти цветок</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background-image: url("fon.PNG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================
   ПРОГРЕСС
   ========================= */

#progress {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 100;

    padding: 10px 24px;
    border-radius: 30px;

    background: rgba(255,255,255,0.92);
    color: #4d704c;

    font-size: clamp(20px, 2.4vw, 34px);
    font-weight: 800;

    box-shadow: 0 5px 14px rgba(0,0,0,0.12);
}


/* =========================
   ЦЕНТР
   ========================= */

#plantArea {
    position: absolute;

    left: 50%;
    bottom: 7%;

    transform: translateX(-50%);

    width: min(25vw, 350px);
    height: min(44vw, 500px);

    min-width: 240px;
    min-height: 360px;

    z-index: 10;
}


/* =========================
   РАСТЕНИЕ
   ========================= */

#plant {
    position: absolute;

    left: 50%;

    /*
       Опускаем растение внутрь горшка.
       Теперь нижняя часть PNG должна
       заходить в область земли.
    */
   bottom: 30%;

    width: 170px;
    height: 230px;

    transform: translateX(-50%);

    transform-origin: center bottom;

   z-index: 35;

    pointer-events: none;
}


/* =========================
   ОБЩИЕ СТИЛИ СТАДИЙ
   ========================= */

.plant-stage {
    position: absolute;

    left: 50%;
    bottom: 0;

    object-fit: contain;
    object-position: center bottom;

    transform-origin: center bottom;

    pointer-events: none;

    /*
       КРИТИЧНО:
       все картинки скрыты,
       пока JS явно не покажет нужную.
    */
    display: none;
}


/* =========================
   РОСТОК
   ========================= */

#sproutImage {
    width: 95px;
    height: 135px;

    transform:
        translateX(-50%)
        scale(1);
}


/* =========================
   БУТОН
   ========================= */

#budImage {
    width: 155px;
    height: 225px;

    

    transform:
        translateX(-50%)
        scale(1);
}


/* =========================
   РАСКРЫТЫЙ ЦВЕТОК
   ========================= */

#flowerImage {
    width: 175px;
    height: 245px;

   

    transform:
        translateX(-50%)
        scale(1);
}


/* =========================
   УВЯДАНИЕ РОСТКА
   ========================= */

#sproutImage.wilt {
    animation:
        wiltSprout
        0.9s
        ease
        forwards;

    filter:
        saturate(0.6)
        brightness(0.82);
}

@keyframes wiltSprout {

    0% {
        transform:
            translateX(-50%)
            rotate(0deg)
            translateY(0)
            scale(1);
    }

    45% {
        transform:
            translateX(-50%)
            rotate(13deg)
            translateY(4px)
            scale(0.98);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(30deg)
            translateY(15px)
            scale(0.93);
    }
}


/* =========================
   ГОРШОК
   ========================= */

#potImage {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 100%;
    height: auto;

    object-fit: contain;

    /*
       Горшок перекрывает низ растения.
    */
    z-index: 30;

    pointer-events: none;

    filter:
        drop-shadow(
            0 10px 8px rgba(0,0,0,0.16)
        );
}


/* =========================
   БУКВА
   ========================= */

#targetLetter {
    position: absolute;

    left: 50%;
    bottom: 15.5%;

    transform: translate(-50%, 50%);

    z-index: 40;

    font-size: clamp(42px, 4.5vw, 66px);
    font-weight: 900;

    color: #a4422e;

    line-height: 1;

    pointer-events: none;
}


/* =========================
   ЛЕЙКИ
   ========================= */

.watering-can {
    position: absolute;

    bottom: 7%;

    width: min(24vw, 330px);

    cursor: pointer;

    z-index: 60;

    transform-origin: center center;

    transition:
        left 0.8s ease,
        right 0.8s ease,
        bottom 0.8s ease,
        transform 0.65s ease;

    touch-action: manipulation;
}

#leftCan {
    left: 12%;
}

#rightCan {
    right: 12%;
}

.watering-can img {
    display: block;

    width: 100%;
    height: auto;

    pointer-events: none;

    filter:
        drop-shadow(
            0 8px 7px rgba(0,0,0,0.14)
        );
}


/* =========================
   ВОДА
   ========================= */

.water-drop {
    position: fixed;

    width: 14px;
    height: 20px;

    border-radius: 50% 50% 60% 60%;

    background:
        linear-gradient(
            #84d8ff,
            #3aa5e4
        );

    z-index: 90;

    pointer-events: none;
}


/* =========================
   ДАЛЬШЕ
   ========================= */

#nextButton {
    position: absolute;

    right: 4%;
    bottom: 4%;

    padding: 17px 36px;

    border: none;
    border-radius: 30px;

    background: white;
    color: #3f7748;

    font-size: 24px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 15px
        rgba(0,0,0,0.15);

    z-index: 110;

    display: none;
}


/* =========================
   АДАПТАЦИЯ
   ========================= */

@media (max-width: 900px) {

    .watering-can {
        width: min(27vw, 280px);
    }

    #leftCan {
        left: 8%;
    }

    #rightCan {
        right: 8%;
    }

}

</style>
</head>


<body>

<div id="game">


    <div id="progress">
        1 / 2
    </div>


    <!-- ЛЕВАЯ ЛЕЙКА -->

    <div
        class="watering-can"
        id="leftCan"
    >
        <img
            id="leftCanImage"
            src=""
            alt=""
            draggable="false"
        >
    </div>


    <!-- ПРАВАЯ ЛЕЙКА -->

    <div
        class="watering-can"
        id="rightCan"
    >
        <img
            id="rightCanImage"
            src=""
            alt=""
            draggable="false"
        >
    </div>


    <!-- ЦЕНТР -->

    <div id="plantArea">


        <!-- РАСТЕНИЕ -->

        <div id="plant">

            <!-- СТАДИЯ 1 -->
            <img
                id="sproutImage"
                class="plant-stage"
                src="images/plants/sprout.PNG"
                alt=""
                draggable="false"
            >

            <!-- СТАДИЯ 2 -->
            <img
                id="budImage"
                class="plant-stage"
                src="images/plants/flower1_bud.PNG"
                alt=""
                draggable="false"
            >

            <!-- СТАДИЯ 3 -->
            <img
                id="flowerImage"
                class="plant-stage"
                src="images/plants/flower1.PNG"
                alt=""
                draggable="false"
            >

        </div>


        <!-- ГОРШОК -->

        <img
            id="potImage"
            src="gorschok.PNG"
            alt=""
            draggable="false"
        >


        <!-- БУКВА -->

        <div id="targetLetter">
            Л
        </div>

    </div>


    <button id="nextButton">
        Дальше
    </button>


</div>


<script>

/* =====================================
   РАУНДЫ
   ===================================== */

const rounds = [

    {
        letter: "Л",

        leftImage:
            "images/round1_left.PNG",

        rightImage:
            "images/round1_right.PNG",

        correct: "left",

        budImage:
            "images/plants/flower1_bud.PNG",

        flowerImage:
            "images/plants/flower1.PNG"
    },

    {
        letter: "Р",

        leftImage:
            "images/round2_left.PNG",

        rightImage:
            "images/round2_right.PNG",

        correct: "left",

        budImage:
            "images/plants/flower1_bud.PNG",

        flowerImage:
            "images/plants/flower1.PNG"
    }

];


/* =====================================
   ПЕРЕМЕННЫЕ
   ===================================== */

let currentRound = 0;

let animationLocked = false;

let roundFinished = false;


/* =====================================
   ЭЛЕМЕНТЫ
   ===================================== */

const leftCan =
    document.getElementById("leftCan");

const rightCan =
    document.getElementById("rightCan");

const leftCanImage =
    document.getElementById("leftCanImage");

const rightCanImage =
    document.getElementById("rightCanImage");

const sproutImage =
    document.getElementById("sproutImage");

const budImage =
    document.getElementById("budImage");

const flowerImage =
    document.getElementById("flowerImage");

const targetLetter =
    document.getElementById("targetLetter");

const progress =
    document.getElementById("progress");

const potImage =
    document.getElementById("potImage");

const nextButton =
    document.getElementById("nextButton");


/* =====================================
   ПРЕДЗАГРУЗКА
   ===================================== */

function preloadImages() {

    const files = [

        "images/round1_left.PNG",
        "images/round1_right.PNG",

        "images/round2_left.PNG",
        "images/round2_right.PNG",

        "images/plants/sprout.PNG",
        "images/plants/flower1_bud.PNG",
        "images/plants/flower1.PNG"

    ];


    files.forEach(src => {

        const img = new Image();

        img.src = src;

    });

}


/* =====================================
   ПОКАЗАТЬ ТОЛЬКО ОДНУ СТАДИЮ
   ===================================== */

function showOnly(stage) {

    /*
       Сначала физически скрываем ВСЁ.
    */

    sproutImage.style.display =
        "none";

    budImage.style.display =
        "none";

    flowerImage.style.display =
        "none";


    /*
       Потом показываем ровно
       ОДНУ нужную картинку.
    */

    if (stage === "sprout") {

        sproutImage.style.display =
            "block";

    }

    else if (stage === "bud") {

        budImage.style.display =
            "block";

    }

    else if (stage === "flower") {

        flowerImage.style.display =
            "block";

    }

}


/* =====================================
   ЗАГРУЗКА РАУНДА
   ===================================== */

function loadRound() {

    const round =
        rounds[currentRound];


    animationLocked = false;

    roundFinished = false;


    progress.textContent =
        `${currentRound + 1} / ${rounds.length}`;


    targetLetter.textContent =
        round.letter;


    leftCanImage.src =
        round.leftImage;


    rightCanImage.src =
        round.rightImage;


    budImage.src =
        round.budImage;


    flowerImage.src =
        round.flowerImage;


    resetPlant();

    resetCans();


    nextButton.style.display =
        "none";

}


/* =====================================
   СБРОС РАСТЕНИЯ
   ===================================== */

function resetPlant() {

    sproutImage.classList.remove(
        "wilt"
    );


    sproutImage.style.animation =
        "none";


    sproutImage.style.filter =
        "none";


    sproutImage.style.transform =
        `
        translateX(-50%)
        rotate(0deg)
        translateY(0)
        scale(1)
        `;


    budImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    flowerImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    /*
       Начало раунда:
       ТОЛЬКО РОСТОК.
    */

    showOnly("sprout");

}


/* =====================================
   СБРОС ЛЕЕК
   ===================================== */

function resetCans() {

    leftCan.style.left =
        "12%";

    leftCan.style.right =
        "auto";

    leftCan.style.bottom =
        "7%";

    leftCan.style.transform =
        "rotate(0deg)";


    rightCan.style.right =
        "12%";

    rightCan.style.left =
        "auto";

    rightCan.style.bottom =
        "7%";

    rightCan.style.transform =
        "rotate(0deg)";

}


/* =====================================
   НАЖАТИЕ
   ===================================== */

async function chooseCan(side) {

    if (
        animationLocked ||
        roundFinished
    ) {
        return;
    }


    animationLocked = true;


    const round =
        rounds[currentRound];


    const can =
        side === "left"
        ? leftCan
        : rightCan;


    const correct =
        side === round.correct;


    await animateWatering(
        can,
        side
    );


    if (correct) {

        await growPlant();


        roundFinished = true;


        nextButton.style.display =
            "block";

    }

    else {

        await wiltPlant();

    }


    animationLocked = false;

}


/* =====================================
   ПОЛИВ
   ===================================== */

async function animateWatering(
    can,
    side
) {

    if (side === "left") {

        can.style.left =
            "28%";

        can.style.bottom =
            "35%";

        can.style.transform =
            "rotate(28deg)";

    }

    else {

        can.style.right =
            "28%";

        can.style.bottom =
            "35%";

        can.style.transform =
            "rotate(-28deg)";

    }


    await wait(750);


    createWater(
        can,
        side
    );


    await wait(1200);


    /*
       Возвращаем лейку.
    */

    if (side === "left") {

        can.style.left =
            "12%";

        can.style.bottom =
            "7%";

        can.style.transform =
            "rotate(0deg)";

    }

    else {

        can.style.right =
            "12%";

        can.style.bottom =
            "7%";

        can.style.transform =
            "rotate(0deg)";

    }


    await wait(600);

}


/* =====================================
   ВОДА
   ===================================== */

function createWater(
    can,
    side
) {

    const canRect =
        can.getBoundingClientRect();


    const potRect =
        potImage.getBoundingClientRect();


    const startX =
        side === "left"

        ? canRect.right -
          canRect.width * 0.12

        : canRect.left +
          canRect.width * 0.12;


    const startY =
        canRect.top +
        canRect.height * 0.45;


    const endX =
        potRect.left +
        potRect.width / 2;


    const endY =
        potRect.top +
        potRect.height * 0.12;


    for (
        let i = 0;
        i < 14;
        i++
    ) {

        setTimeout(
            () => {

                createDrop(
                    startX,
                    startY,
                    endX,
                    endY
                );

            },

            i * 70
        );

    }

}


/* =====================================
   КАПЛЯ
   ===================================== */

function createDrop(
    startX,
    startY,
    endX,
    endY
) {

    const drop =
        document.createElement("div");


    drop.className =
        "water-drop";


    drop.style.left =
        `${startX}px`;

    drop.style.top =
        `${startY}px`;

    drop.style.opacity =
        "1";


    document.body.appendChild(
        drop
    );


    requestAnimationFrame(
        () => {

            drop.style.transition =
                `
                left .7s linear,
                top .7s ease-in,
                opacity .7s linear
                `;


            drop.style.left =
                `${endX}px`;


            drop.style.top =
                `${endY}px`;


            drop.style.opacity =
                ".2";

        }
    );


    setTimeout(
        () => drop.remove(),
        760
    );

}


/* =====================================
   ПРАВИЛЬНЫЙ ОТВЕТ

   Теперь порядок физически такой:

   sprout
   ↓
   bud
   ↓
   flower

   Другого варианта у кода нет.
   ===================================== */

async function growPlant() {


    /*
       Если до этого был неправильный ответ,
       выпрямляем росток.
    */

    sproutImage.classList.remove(
        "wilt"
    );


    sproutImage.style.animation =
        "none";


    sproutImage.style.filter =
        "none";


    sproutImage.style.transform =
        `
        translateX(-50%)
        rotate(0deg)
        translateY(0)
        scale(1)
        `;


    /*
       =========================
       СТАДИЯ 1 — РОСТОК
       =========================
    */

    showOnly("sprout");


    await wait(250);


    sproutImage.style.transition =
        "transform .5s ease";


    sproutImage.style.transform =
        `
        translateX(-50%)
        scale(1.08)
        `;


    await wait(600);



    /*
       =========================
       СТАДИЯ 2 — БУТОН
       =========================
    */

    showOnly("bud");


    budImage.style.transition =
        "none";


    budImage.style.transform =
        `
        translateX(-50%)
        scale(.72)
        `;


    /*
       Два кадра, чтобы браузер
       точно отрисовал бутон.
    */

    await nextFrame();

    await nextFrame();


    budImage.style.transition =
        "transform .7s ease";


    budImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    /*
       Бутон специально остаётся
       видимым достаточно долго.
    */

    await wait(1300);



    /*
       =========================
       СТАДИЯ 3 — ЦВЕТОК
       =========================
    */

    showOnly("flower");


    flowerImage.style.transition =
        "none";


    flowerImage.style.transform =
        `
        translateX(-50%)
        scale(.72)
        `;


    await nextFrame();

    await nextFrame();


    flowerImage.style.transition =
        "transform .7s ease";


    flowerImage.style.transform =
        `
        translateX(-50%)
        scale(1.08)
        `;


    await wait(500);


    flowerImage.style.transform =
        `
        translateX(-50%)
        scale(1)
        `;


    await wait(400);

}


/* =====================================
   НЕПРАВИЛЬНЫЙ ОТВЕТ
   ===================================== */

async function wiltPlant() {


    /*
       При неправильном ответе
       физически показываем только росток.
    */

    showOnly("sprout");


    sproutImage.classList.remove(
        "wilt"
    );


    sproutImage.style.animation =
        "none";


    sproutImage.style.filter =
        "none";


    sproutImage.style.transform =
        `
        translateX(-50%)
        rotate(0deg)
        translateY(0)
        scale(1)
        `;


    /*
       Перезапуск анимации.
    */

    void sproutImage.offsetWidth;


    sproutImage.style.animation =
        "";


    sproutImage.classList.add(
        "wilt"
    );


    await wait(1000);


    /*
       Не сбрасываем.
       Он остаётся увядшим.
    */

}


/* =====================================
   ДАЛЬШЕ
   ===================================== */

nextButton.addEventListener(
    "click",
    () => {

        if (animationLocked) {
            return;
        }


        currentRound++;


        if (
            currentRound >=
            rounds.length
        ) {

            finishGame();

            return;
        }


        loadRound();

    }
);


/* =====================================
   ФИНАЛ
   ===================================== */

function finishGame() {

    document
        .getElementById("game")
        .innerHTML = `

        <div
            style="
                position:absolute;
                inset:0;

                display:flex;
                flex-direction:column;

                justify-content:center;
                align-items:center;

                background:
                    rgba(255,255,255,.22);
            "
        >

            <h1
                style="
                    color:#426d46;

                    font-size:
                    clamp(
                        34px,
                        5vw,
                        65px
                    );
                "
            >
                Игра окончена!
            </h1>


            <button
                onclick="location.reload()"

                style="
                    padding:18px 38px;

                    border:0;

                    border-radius:30px;

                    background:white;

                    color:#39764b;

                    font-size:24px;
                    font-weight:800;

                    cursor:pointer;
                "
            >
                Играть ещё раз
            </button>

        </div>
        `;

}


/* =====================================
   СЛЕДУЮЩИЙ КАДР
   ===================================== */

function nextFrame() {

    return new Promise(
        resolve => {

            requestAnimationFrame(
                () => resolve()
            );

        }
    );

}


/* =====================================
   ПАУЗА
   ===================================== */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================
   КЛИКИ
   ===================================== */

leftCan.addEventListener(
    "click",
    () => chooseCan("left")
);


rightCan.addEventListener(
    "click",
    () => chooseCan("right")
);


/* =====================================
   ЗАПУСК
   ===================================== */

preloadImages();

loadRound();

</script>

</body>
</html>
